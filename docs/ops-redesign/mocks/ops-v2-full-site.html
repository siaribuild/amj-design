<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<!-- Recovered from a claude.ai artifact (see ../BRAINSTORM-TRANSCRIPT.md). The
     artifact host runtime that wrapped this file has been stripped; the
     document below is unmodified. -->
</head>
<body>

<title>OpenFrame Ops — v2, full site</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  /* ============ TOKENS ============ */
  :root{
    --paper:#F3F5F7; --surface:#FFFFFF; --surface-2:#EBEEF1; --surface-3:#E1E6EA;
    --line:#D7DEE4; --line-strong:#B9C3CB;
    --text-1:#171E25; --text-2:#57646F; --text-3:#8A97A1;
    --accent:#1F4E8C; --accent-strong:#163A69; --accent-soft:#E5EDF7; --accent-ink:#0E2A4E;
    --good:#2E7D4F; --good-soft:#E4F3EA;
    --warn:#A8681A; --warn-soft:#FBF0DE;
    --critical:#B23A3A; --critical-soft:#FBE8E8;
    --radius-sm:4px; --radius-md:7px; --radius-lg:12px;
    --tap-min:44px;
    --shadow-1:0 1px 2px rgba(23,30,37,.06), 0 1px 1px rgba(23,30,37,.04);
    --shadow-sheet:0 -12px 32px rgba(20,30,40,.18), 0 -2px 6px rgba(20,30,40,.08);
    --shadow-pop:0 10px 30px rgba(20,30,40,.16), 0 2px 8px rgba(20,30,40,.08);
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Consolas, monospace;
    color-scheme: light;
    /* The nav shell (sidebar + mobile drawer) is a fixed dark chrome, same in
       both themes — it's the staff console's identity, not content, matching
       how the real app's own sidebar (bg-ops) doesn't follow a light/dark
       toggle either. Defined once here rather than duplicated per theme block. */
    --shell:#12181F; --shell-line:rgba(255,255,255,.1); --shell-text:#fff;
    --shell-text-dim:rgba(255,255,255,.5); --shell-text-dimmer:rgba(255,255,255,.35);
    --shell-active-bg:rgba(255,255,255,.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#10151B; --surface:#161D25; --surface-2:#1C242D; --surface-3:#232C36;
      --line:#2A333D; --line-strong:#3A4552;
      --text-1:#E8EDF2; --text-2:#9AA7B2; --text-3:#6B7885;
      --accent:#6FA3E0; --accent-strong:#8FBBEE; --accent-soft:#1C2E44; --accent-ink:#DCEBFB;
      --good:#5CC98A; --good-soft:#16301F;
      --warn:#E0A94A; --warn-soft:#362A12;
      --critical:#E67373; --critical-soft:#3A1B1B;
      --shadow-1:0 1px 2px rgba(0,0,0,.4);
      --shadow-sheet:0 -12px 32px rgba(0,0,0,.55);
      --shadow-pop:0 10px 30px rgba(0,0,0,.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#10151B; --surface:#161D25; --surface-2:#1C242D; --surface-3:#232C36;
    --line:#2A333D; --line-strong:#3A4552;
    --text-1:#E8EDF2; --text-2:#9AA7B2; --text-3:#6B7885;
    --accent:#6FA3E0; --accent-strong:#8FBBEE; --accent-soft:#1C2E44; --accent-ink:#DCEBFB;
    --good:#5CC98A; --good-soft:#16301F;
    --warn:#E0A94A; --warn-soft:#362A12;
    --critical:#E67373; --critical-soft:#3A1B1B;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-sheet:0 -12px 32px rgba(0,0,0,.55);
    --shadow-pop:0 10px 30px rgba(0,0,0,.5);
    color-scheme: dark;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--text-1);
    font-family:var(--font-ui); font-size:14px; line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent-soft); color:var(--accent-ink);}
  button{font:inherit; color:inherit;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  .eyebrow{
    font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
    color:var(--text-3);
  }
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

  /* ============ APP FRAME (mock harness, not product) ============ */
  #app-outer{
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:28px 16px 120px; gap:18px;
  }
  .device{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg);
    box-shadow:var(--shadow-1); overflow:hidden; width:100%; max-width:1366px; height:820px;
    display:flex; flex-direction:column;
    /* This box is a CSS container — every "mobile" rule below reacts to ITS
       rendered width via @container. There is no separate toggle mechanism
       to keep in sync: resize the real window and it reflows, because
       that's the only mechanism there is. */
    container-type: inline-size; container-name: device;
  }
  /* The breakpoint matches the real app's own `md:` (768px) — not a number
     invented for this mock. */

  /* ============ APP SHELL: sidebar + content column ============ */
  .app-body{ flex:1; min-height:0; display:flex; }
  .main-col{ flex:1; min-width:0; display:flex; flex-direction:column; }

  .sidebar{
    width:224px; flex:0 0 auto; background:var(--shell); color:var(--shell-text);
    display:flex; flex-direction:column;
  }
  .sidebar-brand{ height:56px; flex:0 0 auto; display:flex; align-items:center; padding:0 20px; border-bottom:1px solid var(--shell-line); }
  .sidebar-nav{ flex:1; overflow-y:auto; padding:12px 0; }
  .sidebar-item{
    width:100%; display:flex; align-items:center; gap:10px; padding:9px 20px; border:0; background:transparent;
    color:var(--shell-text-dim); font-size:13px; font-weight:600; cursor:pointer; border-left:2px solid transparent;
    text-align:left;
  }
  .sidebar-item svg{ width:16px; height:16px; flex:0 0 auto; opacity:.85; }
  .sidebar-item:hover{ color:var(--shell-text); }
  .sidebar-item[aria-current="true"]{ color:var(--shell-text); background:var(--shell-active-bg); border-color:var(--accent); }
  .sidebar-foot{ padding:12px; border-top:1px solid var(--shell-line); flex:0 0 auto; }
  .sidebar-foot .who{ padding:0 8px 8px; overflow:hidden; }
  .sidebar-foot .name{ color:var(--shell-text); font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sidebar-foot .email{ color:var(--shell-text-dimmer); font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sidebar-foot button{
    width:100%; display:flex; align-items:center; gap:8px; padding:7px 8px; border:0; background:transparent;
    color:var(--shell-text-dim); font-size:12.5px; cursor:pointer; text-align:left;
  }
  .sidebar-foot button:hover{ color:var(--shell-text); }
  .sidebar-foot button svg{ width:14px; height:14px; }

  /* mobile left drawer — same technique as the right-side panels (scrim +
     translate), mirrored: nav lives on the left, context (filters, confirm)
     on the right, so the two never compete for the same edge. */
  .navdrawer{
    position:fixed; inset-block:0; left:0; width:264px; max-width:82vw; background:var(--shell); color:var(--shell-text);
    z-index:50; transform:translateX(-100%); transition:transform .2s ease-out; display:flex; flex-direction:column;
  }
  .navdrawer.on{ transform:translateX(0); }
  .navdrawer .sidebar-brand{ justify-content:space-between; }

  /* ============ TOPBAR (now inside .main-col, beside the sidebar, not spanning it) ============ */
  .topbar{
    flex:0 0 auto; height:52px; display:flex; align-items:center; gap:10px;
    padding:0 18px; border-bottom:1px solid var(--line); background:var(--surface);
  }
  /* .topbar .menu-btn (0,2,0) beats .icon-btn's display:flex (0,1,0)
     regardless of source order — the bug this replaces was exactly that:
     .menu-btn{display:none} and .icon-btn{display:flex} have EQUAL
     specificity, .icon-btn is declared later in the sheet, so it won and the
     hamburger showed on every width, sidebar or not. Same fix pattern
     applies inside the @container override below. */
  .topbar .menu-btn{ display:none; }
  .topbar h1{ margin:0; font-size:15px; font-weight:700; color:var(--text-1); }
  .brand{ display:flex; align-items:baseline; gap:7px; font-weight:800; font-size:15px; letter-spacing:-.01em; color:#fff; }
  .brand small{ font-weight:500; color:rgba(255,255,255,.55); font-size:13px; }
  .topbar .spacer{ flex:1; }
  .avatar{
    width:26px; height:26px; border-radius:50%; background:var(--accent-soft); color:var(--accent-strong);
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex:0 0 auto;
  }
  .topbar-search{ display:block; }

  /* ============ SCREEN BODY ============ */
  .screen{ flex:1; min-height:0; overflow:auto; background:var(--paper); }

  /* ---- page head (list surfaces) ---- */
  .pagehead{ padding:18px 20px 14px; }
  .pagehead h1{ margin:2px 0 0; font-size:21px; font-weight:800; letter-spacing:-.015em; text-wrap:balance; }
  .pagehead h1 .count{ font-weight:500; color:var(--text-3); font-size:14px; margin-left:6px; }

  /* ---- control row: segmented + filter chip + search, one line, fixed height ---- */
  .controlrow{
    display:flex; align-items:center; gap:8px; padding:0 20px 14px; flex-wrap:nowrap;
  }

  .segmented{
    display:inline-flex; background:var(--surface-2); border-radius:var(--radius-md); padding:3px;
    border:1px solid var(--line); flex:0 0 auto;
  }
  .segmented button{
    border:0; background:transparent; padding:6px 12px; border-radius:5px; font-size:13px; font-weight:600;
    color:var(--text-2); cursor:pointer; white-space:nowrap; min-height:32px;
  }
  .segmented button[aria-selected="true"]{ background:var(--surface); color:var(--text-1); box-shadow:var(--shadow-1); }
  .segmented button .n{ color:var(--text-3); font-weight:500; margin-left:4px; }
  .segmented button[aria-selected="true"] .n{ color:var(--accent); }

  .filter-chip{
    display:inline-flex; align-items:center; gap:6px; padding:6px 10px 6px 11px; border-radius:999px;
    border:1px solid var(--line-strong); background:var(--surface); cursor:pointer; font-size:13px; font-weight:600;
    color:var(--text-1); min-height:32px; flex:0 0 auto;
  }
  .filter-chip:hover{ border-color:var(--accent); }
  .filter-chip .badge{
    background:var(--accent-soft); color:var(--accent-strong); border-radius:999px; padding:1px 7px;
    font-size:11.5px; font-weight:700; font-family:var(--font-mono);
  }
  .filter-chip svg{ width:13px; height:13px; opacity:.55; }

  .spacer-flex{ flex:1; }

  .icon-btn{
    width:32px; height:32px; border-radius:8px; border:1px solid transparent; background:transparent;
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-2); flex:0 0 auto;
  }
  .icon-btn:hover{ background:var(--surface-2); color:var(--text-1); }
  .icon-btn svg{ width:16px; height:16px; }

  .search-wrap{ display:flex; align-items:center; overflow:hidden; }
  .search-input{
    width:0; opacity:0; border:0; background:var(--surface-2); border-radius:8px; font-size:13px;
    padding:0; height:32px; transition:width .16s ease, padding .16s ease, opacity .12s ease;
    color:var(--text-1);
  }
  .search-input.open{ width:180px; opacity:1; padding:0 10px; margin-left:2px; }
  .search-input::placeholder{ color:var(--text-3); }

  .meta-line{ padding:0 20px 12px; font-size:12px; color:var(--text-3); }

  /* ============ PROJECTS: table (desktop) ============ */
  .ledger-wrap{ padding:0 20px 20px; }
  table.ledger{ width:100%; border-collapse:collapse; font-size:13px; }
  table.ledger thead th{
    text-align:left; font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    color:var(--text-3); padding:8px 12px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--paper);
  }
  table.ledger th.num, table.ledger td.num{ text-align:right; }
  table.ledger tbody tr{ cursor:pointer; }
  table.ledger tbody tr:hover{ background:var(--surface-3); }
  table.ledger td{ padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
  .cell-title{ font-weight:600; color:var(--text-1); }
  .cell-sub{ color:var(--text-3); font-size:12px; margin-top:2px; }
  .waiting-us{ color:var(--text-1); font-weight:700; }
  .waiting-cust{ color:var(--text-2); font-weight:600; }
  .stage-badge{
    display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px;
    background:var(--accent-soft); color:var(--accent-strong);
  }
  .flag-chip{
    display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:2px 8px;
    border-radius:999px; background:var(--warn-soft); color:var(--warn);
  }

  /* ============ PROJECTS: cards (mobile) ============ */
  .cardlist{ flex:1; overflow:auto; padding:0 16px 16px; display:flex; flex-direction:column; gap:8px; }
  .card-row{
    border:1px solid var(--line); border-radius:var(--radius-md); background:var(--surface); padding:11px 12px;
    display:flex; flex-direction:column; gap:6px; cursor:pointer;
  }
  .card-row:active{ background:var(--surface-3); }
  .card-top{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .card-title{ font-weight:700; font-size:14px; color:var(--text-1); }
  .card-value{ font-family:var(--font-mono); font-weight:700; font-size:14px; white-space:nowrap; }
  .card-value .basis{ display:block; font-family:var(--font-ui); font-weight:500; font-size:10.5px; color:var(--text-3); text-align:right; }
  .card-sub{ font-size:12px; color:var(--text-3); }
  .card-bottom{ display:flex; justify-content:space-between; align-items:center; margin-top:2px; }
  .card-meta{ display:flex; align-items:center; gap:8px; font-size:12px; }

  /* ============ RIGHT PANEL (progressive disclosure surface) ============
     Same slide-in-from-right chrome as the editor zone uses at rest — filters and
     editing both live in the same right-hand register instead of two different idioms. */
  .scrim{
    position:fixed; inset:0; background:rgba(15,20,25,.38); opacity:0; pointer-events:none;
    transition:opacity .15s ease; z-index:40;
  }
  .scrim.on{ opacity:1; pointer-events:auto; }

  .sheet{
    position:fixed; top:0; right:0; bottom:0; width:360px; max-width:92vw; background:var(--surface); z-index:41;
    border-radius:0; box-shadow:var(--shadow-pop); border-left:1px solid var(--line);
    transform:translateX(100%); transition:transform .22s cubic-bezier(.32,.72,0,1);
    display:flex; flex-direction:column;
  }
  .sheet.on{ transform:translateX(0); }
  /* mobile: the panel takes the full screen — set by JS (state.size), not by media
     query, because this element intentionally lives outside the simulated .device frame. */
  .sheet.full{ width:100%; max-width:100%; border-left:0; }
  .sheet-head{ padding:16px 18px; display:flex; align-items:center; justify-content:space-between; flex:0 0 auto; border-bottom:1px solid var(--line); }
  .sheet-head h2{ font-size:15px; margin:0; font-weight:800; }
  .sheet-body{ overflow:auto; padding:8px 10px; flex:1; }
  .sheet-row{
    display:flex; align-items:center; justify-content:space-between; width:100%; text-align:left;
    border:0; background:transparent; padding:11px 10px; border-radius:8px; font-size:14px; cursor:pointer;
    min-height:var(--tap-min);
  }
  .sheet-row:hover{ background:var(--surface-2); }
  .sheet-row[aria-selected="true"]{ background:var(--accent-soft); color:var(--accent-ink); font-weight:700; }
  .sheet-row .n{ font-family:var(--font-mono); color:var(--text-3); font-size:12.5px; }
  .sheet-row[aria-selected="true"] .n{ color:var(--accent-strong); }
  .sheet-div{ height:1px; background:var(--line); margin:6px 8px; }
  .sheet-foot{ padding:12px 16px 16px; border-top:1px solid var(--line); flex:0 0 auto; }
  .sort-select{
    width:100%; height:var(--tap-min); border-radius:8px; border:1px solid var(--line-strong);
    background:var(--surface); color:var(--text-1); padding:0 12px; font-size:13.5px;
  }

  /* ============ WORKSPACE — titleblock ============ */
  .titleblock{
    flex:0 0 auto; border-bottom:1px solid var(--line); background:var(--surface);
    padding:10px 20px; display:flex; align-items:center; gap:22px; flex-wrap:wrap;
  }
  .tb-field{ display:flex; flex-direction:column; gap:2px; }
  .tb-field .k{ font-size:9.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-3); }
  .tb-field .v{ font-size:13px; font-weight:700; color:var(--text-1); }
  .tb-field .v.mono{ font-family:var(--font-mono); }
  .tb-field .v.waiting-us{ color:var(--critical); }
  .titleblock .spacer-flex{ flex:1; min-width:8px; }
  .unresolved-chip{
    display:inline-flex; align-items:center; gap:5px; background:var(--critical-soft); color:var(--critical);
    font-weight:700; font-size:12px; padding:5px 10px; border-radius:999px; white-space:nowrap;
  }

  /* ---- phase row: the job's actual progression, and the lever to move it.
     "Ops needs the past, dated and attributed" — a coarse ribbon to orient,
     not a vertical node timeline (that's explicitly rejected in the real
     app's own design notes: ~9 quote states + 12 order stages drawn as nodes
     is a screen and a half of chrome for one integer and four dates). ---- */
  .phaserow{ display:flex; align-items:center; gap:14px; padding:0 20px 12px; flex-wrap:wrap; border-bottom:1px solid var(--line); }
  .phaseribbon{ display:flex; gap:2px; flex:1; min-width:220px; }
  .phase-seg{
    flex:1; text-align:center; font-size:10.5px; font-weight:700; padding:6px 3px 5px;
    border-bottom:3px solid var(--line); color:var(--text-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .phase-seg.done{ border-color:var(--good); color:var(--text-2); }
  .phase-seg.current{ border-color:var(--accent); color:var(--text-1); }
  .stage-action{ flex:0 0 auto; white-space:nowrap; }
  /* Confirm-in-place, never a modal, never the right panel either — a stage
     advance is a single fact to confirm, not a review with deltas and a
     tripwire (that's what the right panel is for, e.g. the pricing confirm). */
  .confirm-strip{
    flex:1; min-width:260px; display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--accent-soft); border:1px solid var(--accent); border-radius:var(--radius-md);
    padding:8px 8px 8px 14px; font-size:12.5px; color:var(--accent-ink);
  }
  .confirm-strip .btns{ display:flex; gap:6px; flex-shrink:0; }

  /* ============ WORKSPACE — desktop: rail + canvas (editor is a right panel now,
     not a third column — see #editor-panel) ============
     Only the desktop branch of renderWorkspace() ever creates a
     .workspace-body element at all (mobile builds .planebar/.plane-body
     instead), so this doesn't need a container query of its own — the JS
     that decides which DOM to build already reacts to real width via the
     ResizeObserver below. */
  .workspace-body{ flex:1; min-height:0; display:grid; grid-template-columns:230px 1fr; }
  .zone{ min-height:0; overflow:auto; }
  .zone + .zone{ border-left:1px solid var(--line); }
  .canvas-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 20px 0; }
  .canvas-head .who{ font-size:12.5px; font-weight:700; color:var(--text-1); }
  .canvas-head .who span{ font-weight:500; color:var(--text-3); margin-left:4px; }
  .btn-primary.btn-compact{ height:30px; padding:0 12px; font-size:12.5px; }

  .rail{ background:var(--surface-2); padding:10px; display:flex; flex-direction:column; gap:2px; }
  .rail-line{
    display:flex; align-items:center; gap:8px; padding:8px 9px; border-radius:7px; cursor:pointer; font-size:12.5px;
  }
  .rail-line:hover{ background:var(--surface-3); }
  .rail-line.active{ background:var(--surface); box-shadow:var(--shadow-1); font-weight:700; }
  .rail-line .verdict{ width:7px; height:7px; border-radius:50%; flex:0 0 auto; }
  .verdict.ok{ background:var(--good); } .verdict.warn{ background:var(--warn); } .verdict.crit{ background:var(--critical); }
  .rail-unit{ padding:6px 9px 6px 26px; font-size:12px; color:var(--text-2); display:flex; align-items:center; gap:7px; }
  .rail-foot{ margin-top:auto; padding:10px 9px 4px; border-top:1px solid var(--line); font-size:12px; display:flex; justify-content:space-between; }
  .rail-foot b{ font-family:var(--font-mono); }

  .canvas{ background:var(--paper); display:flex; flex-direction:column; }
  .composite-wrap{ padding:20px 20px 8px; display:flex; justify-content:center; }
  .composite{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md); }

  /* fits all 5 in one row at 390px — no horizontal scroll on a tab strip, ever */
  .lensbar{ display:flex; gap:2px; padding:4px 10px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .lens-btn{
    display:flex; align-items:center; justify-content:center; gap:5px; flex:1; min-width:0;
    border:0; background:transparent; padding:8px 6px; border-radius:7px;
    font-size:12.5px; font-weight:700; color:var(--text-2); white-space:nowrap; cursor:pointer; overflow:hidden;
  }
  .lens-btn[aria-selected="true"]{ background:var(--accent-soft); color:var(--accent-strong); }
  .lens-btn .lv{ font-weight:500; color:var(--text-3); }
  .lens-btn[aria-selected="true"] .lv{ color:var(--accent-strong); }

  .lens-panel{ padding:14px 20px 20px; font-size:13px; color:var(--text-2); flex:1; }

  .btn-primary:hover{ background:var(--accent-strong); border-color:var(--accent-strong); }

  /* ============ WORKSPACE — mobile plane stack ============ */
  .planebar{ display:flex; align-items:center; gap:8px; padding:8px 14px; border-bottom:1px solid var(--line); }
  .stepper{ display:flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:12px; color:var(--text-3); }

  /* ============ DASHBOARD ============ */

  .needs-row{

    padding:13px 16px; border-bottom:1px solid var(--line); cursor:pointer;
  }
  .needs-row:last-child{ border-bottom:0; }
  .needs-row:hover{ background:var(--surface-2); }
  .needs-row .n{ font-family:var(--font-mono); font-weight:800; font-size:17px; color:var(--text-1); flex:0 0 auto; }
  .needs-row .t{ flex:1; color:var(--text-2); font-size:13px; }
  .needs-row .go{ color:var(--accent); font-size:12px; font-weight:700; flex:0 0 auto; }
  .needs-empty{ border:1px dashed var(--line-strong); border-radius:var(--radius-md); padding:22px; text-align:center; margin-bottom:22px; }
  .needs-empty p{ margin:0; color:var(--text-1); font-weight:600; font-size:13px; }
  .needs-empty span{ color:var(--text-3); font-size:12px; }
  .stat-row{ display:flex; flex-wrap:wrap; border:1px solid var(--line); border-radius:var(--radius-md); overflow:hidden; }
  .stat-cell{ padding:12px 18px; border-right:1px solid var(--line); flex:1; min-width:120px; }
  .stat-cell:last-child{ border-right:0; }
  .stat-cell .k{ font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--text-3); }
  .stat-cell .v{ font-family:var(--font-mono); font-weight:700; font-size:19px; color:var(--text-1); margin-top:2px; }

  /* ============ SUB-TABS (Pricing) — fits without scroll, wraps if it must ============ */
  .subtabs{ display:flex; flex-wrap:wrap; gap:2px; padding:0 20px; border-bottom:1px solid var(--line); margin-bottom:16px; }
  .subtabs button{
    border:0; background:transparent; padding:9px 4px; margin-right:16px; font-size:13px; font-weight:600;
    color:var(--text-3); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;
  }
  .subtabs button[aria-selected="true"]{ color:var(--text-1); border-color:var(--accent); font-weight:700; }

  /* ============ chip filter that WRAPS (never scrolls) — for short lists ============ */
  .chip-wrap{ display:flex; flex-wrap:wrap; gap:6px; padding:0 20px 14px; }
  .chip-wrap button{
    border:1px solid var(--line-strong); background:var(--surface); border-radius:999px; padding:6px 12px;
    font-size:12.5px; font-weight:600; color:var(--text-2); cursor:pointer;
  }
  .chip-wrap button[aria-selected="true"]{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-strong); }

  /* ============ compact list rows (Audit) ============ */
  .list-rows{ padding:0 20px 20px; }

    display:flex; align-items:baseline; gap:10px; padding:9px 4px; border-bottom:1px solid var(--line); font-size:12.5px;

  .list-row .act{ flex:1; min-width:0; color:var(--text-1); }

  /* ============ staff rows (Admin) ============ */
  .staff-card{ border:1px solid var(--line); border-radius:var(--radius-md); overflow:hidden; }
  .staff-row{ display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); }
  .staff-row:last-child{ border-bottom:0; }
  .staff-row .who{ flex:1; min-width:0; }
  .staff-row .who .name{ font-weight:600; font-size:13.5px; color:var(--text-1); }
  .staff-row .who .email{ font-size:12px; color:var(--text-3); }
  .staff-row select{
    height:34px; border:1px solid var(--line-strong); border-radius:7px; padding:0 8px; font-size:12.5px;
    background:var(--surface); color:var(--text-1); flex:0 0 auto;
  }

  /* ============ settings form (Pricing → Policy) ============ */
  .settings-wrap{ padding:0 20px 20px; max-width:480px; }
  .settings-block{ margin-bottom:20px; }
  .settings-block .lbl{ font-size:12.5px; font-weight:600; color:var(--text-1); margin-bottom:6px; }
  .settings-block .help{ font-size:12px; color:var(--text-3); margin-top:6px; line-height:1.5; }

  /* ============ health / info banner ============ */
  .banner{
    margin:0 20px 16px; padding:11px 14px; border-radius:var(--radius-md); background:var(--warn-soft);
    color:var(--warn); font-size:12.5px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .banner a{ color:inherit; font-weight:700; text-decoration:underline; flex:0 0 auto; }

  .scope-note{
    max-width:1366px; width:100%; font-size:12px; color:var(--text-3); text-align:center; padding:0 12px;
  }
  .scope-note b{ color:var(--text-2); }

  /* ============ REAL RESPONSIVE BREAKPOINT ============
     Every rule in here reacts to .device's actual rendered width (see
     container-type on .device above) — not to the JS toggle. Drag the real
     browser window narrower than this and it reflows exactly the same way
     the "Mobile 390" toggle does, because it's the same mechanism, not a
     parallel one that can disagree with it. */
  @container device (max-width: 767.98px){
    .screen{ display:flex; flex-direction:column; }
    .pagehead{ padding:14px 16px 10px; }
    .controlrow{ padding:0 16px 12px; }
    .meta-line{ padding:0 16px 10px; }
    .titleblock{ padding:9px 14px; gap:12px; }
    .btn-ghost, .btn-primary{ height:var(--tap-min); }
    .subtabs{ padding:0 16px; }
    .chip-wrap{ padding:0 16px 12px; }
    .list-rows{ padding:0 16px 20px; }
    .list-row{ flex-wrap:wrap; }
    .list-row .act{ flex-basis:100%; order:1; margin-top:2px; }
    .settings-wrap{ padding:0 16px 20px; }
    .banner{ margin:0 16px 14px; flex-direction:column; align-items:flex-start; }
    .sidebar{ display:none; }
    .topbar .menu-btn{ display:flex; }
    .topbar-search{ display:none; }
    /* .btn-compact (0,2,0) needs an equally-specific override here, or the
       generic .btn-ghost,.btn-primary{height:var(--tap-min)} rule above
       loses to it despite coming later — exactly the .menu-btn bug again,
       just waiting to happen a second time if left as a single class. */
    .btn-primary.btn-compact{ height:var(--tap-min); font-size:13px; padding:0 14px; }
    .phaseribbon{ flex:1 1 100%; }
    .phase-seg{ font-size:9px; padding:5px 2px 4px; }
  }
</style>

<script>
(function(){
  'use strict';

  var PROJECTS = [
    {ref:'OF-Q-10402', order:null, project:'Northcote Renovation', customer:'Rangi Waititi', org:null, lines:4, value:24350, basis:'est.', stage:'Being priced', waiting:'Us', days:2, unpriced:3},

    {ref:'OF-Q-10349', order:null, project:'Mission Bay Apartments — B2', customer:'Kōwhai Developments', org:'Kōwhai Developments', lines:22, value:212400, basis:'est.', stage:'Awaiting customer', days:11, waiting:'Customer', unpriced:0},
    {ref:'OF-Q-10341', order:'SO-8760', project:'Remuera Rebuild', customer:'Peter & Alofa Tuilagi', org:null, lines:7, value:52300, basis:'issued', stage:'Awaiting payment', waiting:'Customer', days:4, unpriced:0},
    {ref:'OF-Q-10330', order:null, project:'Kingsland Retrofit', customer:'Dev Patel', org:null, lines:5, value:19800, basis:'est.', stage:'Being priced', waiting:'Us', days:14, unpriced:2},
    {ref:'OF-Q-10318', order:null, project:'Grey Lynn Cottage', customer:'Hana Ngata', org:null, lines:2, value:8100, basis:'est.', stage:'Submitted', waiting:'Customer', days:3, unpriced:0},
    {ref:'OF-Q-10301', order:'SO-8702', project:'Herne Bay New Build', customer:'Whitmore Family Trust', org:'Whitmore Family Trust', lines:14, value:187600, basis:'contract', stage:'In production', waiting:'Nobody', days:0, unpriced:0}
  ];

  var VIEWS = [
    {key:'needs_us', label:'Needs us', test:function(p){return p.waiting==='Us';}},
    {key:'submitted', label:'Submitted', test:function(p){return p.stage==='Submitted';}},
    {key:'pricing', label:'Being priced', test:function(p){return p.stage==='Being priced';}},
    {key:'ready', label:'Ready to issue', test:function(p){return p.stage==='Ready to issue';}},
    {key:'payment', label:'Awaiting payment', test:function(p){return p.stage==='Awaiting payment';}},
    {key:'customer', label:'Awaiting customer', test:function(p){return p.waiting==='Customer';}},
    {key:'production', label:'In production', test:function(p){return p.stage==='In production';}},
    {key:'open', label:'All open', test:function(p){return p.stage!=='In production'||true;}},
    {key:'all', label:'All', test:function(){return true;}}
  ];
  VIEWS.forEach(function(v){ v.count = PROJECTS.filter(v.test).length; });
  VIEWS[7].count = PROJECTS.filter(function(p){return p.waiting!=='Nobody';}).length;

  var state = {
    screen:'dashboard', size:'desktop',
    activeView:'needs_us', sheetOpen:false, sheetKind:'projects',
    projectOpen:null, plane:'lines', lensIdx:0, activeLine:0, stageConfirm:null,
    customerOpen:null, enquiryOpen:null,
    enqTab:'all', pricingSub:'rate-cards', rateCardOpen:null, rcDraft:null, depositDraft:null, auditFilter:''
  };

  var money = function(n){ return '$' + n.toLocaleString('en-NZ'); };

  // The real console's own TABS array (OpsApp.tsx), not a bigger list
  // invented for this mock — 8 menu items. A project record is reached BY
  // CLICKING a Projects row, same as the real app; it has never been its own
  // menu entry, so it isn't one here either.
  var NAV_ITEMS = [
    {id:'dashboard', label:'Dashboard', icon:'nav-dashboard'},
    {id:'projects', label:'Projects', icon:'nav-file'},
    {id:'customers', label:'Customers', icon:'nav-users'},
    {id:'enquiries', label:'Enquiries', icon:'nav-mail'},
    {id:'pricing', label:'Pricing', icon:'nav-boxes'},
    {id:'files', label:'Files', icon:'nav-folder'},
    {id:'audit', label:'Audit', icon:'nav-scroll'},
    {id:'admin', label:'Admin', icon:'nav-settings'}
  ];
  var SCREENS = NAV_ITEMS.map(function(n){ return n.id; });
  var SCREEN_LABEL = {}; NAV_ITEMS.forEach(function(n){ SCREEN_LABEL[n.id] = n.label; });

  function svgIcon(name){
    var icons = {
      filter:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 4h14M6 10h8M9 16h2"/></svg>',
      search:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M16 16l-3.2-3.2"/></svg>',
      chevron:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 8l4 4 4-4"/></svg>',
      back:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12.5 5l-5 5 5 5"/></svg>',
      close:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 5l10 10M15 5L5 15"/></svg>',
      signout:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 4H4v12h4M13 6l4 4-4 4M6.5 10H17"/></svg>',
      'nav-dashboard':'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="11" y="3" width="6" height="6" rx="1"/><rect x="3" y="11" width="6" height="6" rx="1"/><rect x="11" y="11" width="6" height="6" rx="1"/></svg>',
      'nav-file':'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 3h6l4 4v10H5z"/><path d="M11 3v4h4"/></svg>',
      'nav-users':'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7.5" cy="7" r="2.6"/><path d="M2.5 16c0-3 2.2-4.6 5-4.6s5 1.6 5 4.6"/><path d="M13 6a2.4 2.4 0 0 1 0 4.6M15.5 16c0-2.4-1.4-3.8-3-4.3"/></svg>',
      'nav-mail':'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="4.5" width="15" height="11" rx="1.5"/><path d="M3 5.5l7 5.5 7-5.5"/></svg>',
      'nav-boxes':'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 6l7-3.2L17 6v8l-7 3.2L3 14z"/><path d="M3 6l7 3.2L17 6M10 9.2V17"/></svg>',
      'nav-folder':'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2.5 5.5A1 1 0 0 1 3.5 4.5h3.8l1.4 1.8h7.3a1 1 0 0 1 1 1v7.2a1 1 0 0 1-1 1h-13a1 1 0 0 1-1-1z"/></svg>',
      'nav-scroll':'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 3h9v12.5a1.5 1.5 0 0 1-3 0V3M5 3a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h6"/></svg>',
      'nav-settings':'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="2.6"/><path d="M10 3v2M10 15v2M4.2 5.2l1.4 1.4M14.4 13.4l1.4 1.4M3 10h2M15 10h2M4.2 14.8l1.4-1.4M14.4 6.6l1.4-1.4"/></svg>'
    };
    return icons[name] || '';
  }

  /* ---------------- PROJECTS SCREEN ---------------- */
  function renderProjects(){
    if (state.projectOpen) { renderProjectRecord(); return; }
    var view = VIEWS.filter(function(v){return v.key===state.activeView;})[0];
    var rows = PROJECTS.filter(view.test);
    var quick = [VIEWS[0], VIEWS[7]]; // Needs us / All open — the two states people live in daily

    var html = '';
    html += '<div class="pagehead"><div class="eyebrow">Ledger</div><h1>Projects <span class="count">' + PROJECTS.length + '</span></h1></div>';

    html += '<div class="controlrow">';
    html += '<div class="segmented" role="tablist" aria-label="Quick filter">';
    quick.forEach(function(v){
      var sel = state.activeView===v.key;
      html += '<button role="tab" aria-selected="'+sel+'" data-quick="'+v.key+'">'+v.label+'<span class="n">'+v.count+'</span></button>';
    });
    html += '</div>';
    var showingFullSheet = quick.indexOf(view) === -1;
    html += '<button class="filter-chip" id="filter-chip">'+svgIcon('filter')+'<span>'+ (showingFullSheet ? view.label : 'More filters') +'</span>'+(showingFullSheet ? '<span class="badge">'+view.count+'</span>' : '')+'</button>';
    html += '<div class="spacer-flex"></div>';
    html += '<div class="search-wrap"><input class="search-input" id="search-input" placeholder="ref, order, customer…"></div>';
    html += '<button class="icon-btn" id="search-toggle" aria-label="Search">'+svgIcon('search')+'</button>';
    html += '</div>';

    html += '<div class="meta-line">' + rows.length + ' of ' + PROJECTS.length + ' · server’s own order, oldest obligation first</div>';

    if (state.size === 'desktop') {
      html += '<div class="ledger-wrap"><table class="ledger"><thead><tr>';
      html += '<th>Ref</th><th>Project</th><th>Customer</th><th class="num">Lines</th><th class="num">Value</th><th>Stage</th><th>Waiting on</th><th class="num">Days</th><th></th></tr></thead><tbody>';
      rows.forEach(function(p){
        html += '<tr data-project="'+p.ref+'">';
        html += '<td class="mono">'+p.ref+(p.order?'<div class="cell-sub mono">'+p.order+'</div>':'')+'</td>';
        html += '<td><div class="cell-title">'+p.project+'</div>'+(p.org?'<div class="cell-sub">'+p.org+'</div>':'')+'</td>';
        html += '<td>'+p.customer+'</td>';
        html += '<td class="num mono">'+p.lines+'</td>';
        html += '<td class="num mono"><div>'+money(p.value)+'</div><div class="cell-sub">'+p.basis+'</div></td>';
        html += '<td><span class="stage-badge">'+p.stage+'</span></td>';

  // The job's actual progression — the thing missing before. A coarse
  // 6-stage ribbon (matches the real app's own phase vocabulary), not a
  // per-quote-state timeline: Ops needs "where is it and what do I do next",
  // not every internal transition drawn as a node.
  var PHASES = ['Intake','Pricing','Issued','Accepted','Prod.','Delivered'];
  function phaseIndexFor(p){
    if (p.stage==='Submitted') return 0;
    if (p.stage==='Being priced' || p.stage==='Ready to issue') return 1;
    if (p.stage==='Awaiting customer') return 2;
    if (p.stage==='Awaiting payment') return 3;
    if (p.stage==='In production') return 4;
    return 5;
  }
  // The actual lever, not just a label — what moves this job to the next
  // stage from here. Null when there's nothing for ops to do (waiting on the
  // customer, or already delivered) — matching the "Waiting on" column's own
  // logic rather than contradicting it.
  function nextActionFor(p){
    if (p.stage==='Submitted') return p.waiting==='Us' ? {label:'Start pricing', toStage:'Being priced'} : null;
    if (p.stage==='Being priced') return (p.waiting==='Us' && !p.unpriced) ? {label:'Issue revision', toStage:'Awaiting customer'} : null;
    if (p.stage==='Ready to issue') return {label:'Issue revision', toStage:'Awaiting customer'};
    if (p.stage==='Awaiting payment') return {label:'Record payment', toStage:'In production'};
    if (p.stage==='In production') return {label:'Mark delivered', toStage:'Delivered'};
    return null;
  }

  function openConfirm(rc){
    state.confirmFor = rc.slug;

  function closeConfirm(){

  function escCloseConfirm(e){ if(e.key==='Escape') closeConfirm(); }
  function renderConfirmPanel(rc){
    var d = state.rcDraft;
    var pct = Math.round(Math.max(Math.abs((d.perim-rc.perim)/(rc.perim||1)), Math.abs((d.area-rc.area)/(rc.area||1)))*100);

    var html = '<div class="sheet-head"><h2>Review pricing change</h2><button class="icon-btn" id="confirm-close" aria-label="Close">✕</button></div>';
    html += '<div class="sheet-body">';
    html += '<div class="kv-row"><span class="k">Perimeter rate</span><span class="v mono">$'+rc.perim.toFixed(2)+' → $'+d.perim.toFixed(2)+'</span></div>';
    html += '<div class="kv-row"><span class="k">Area rate</span><span class="v mono">$'+rc.area.toFixed(2)+' → $'+d.area.toFixed(2)+'</span></div>';

    if (tripwire){
      html += '<div style="margin-top:14px;padding:10px 12px;border-radius:7px;background:var(--warn-soft);color:var(--warn);font-size:12.5px;">This is a '+pct+'% change. Type the product slug to confirm.<input id="confirm-typed" style="width:100%;margin-top:8px;height:36px;border:1px solid var(--line-strong);border-radius:6px;padding:0 10px;background:var(--surface);color:var(--text-1);" placeholder="'+rc.slug+'"></div>';
    }
    html += '</div>';
    html += '<div class="sheet-foot" style="border-top:1px solid var(--line);"><div style="display:flex;justify-content:flex-end;gap:8px;"><button class="btn-ghost" id="confirm-cancel">Cancel</button><button class="btn-primary" id="confirm-save">Save new rates</button></div></div>';
    document.getElementById('confirm-panel').innerHTML = html;
    document.getElementById('confirm-close').addEventListener('click', closeConfirm);
    document.getElementById('confirm-cancel').addEventListener('click', closeConfirm);
    document.getElementById('confirm-save').addEventListener('click', function(){
      rc.perim = d.perim; rc.area = d.area; rc.min = d.min;
      state.rcDraft = null; closeConfirm(); render();
    });
  }

      FILES.forEach(function(f){
        html += '<div class="card-row"><div class="card-top"><div><div class="card-title">'+f.name+'</div><div class="card-sub">'+f.project+' · '+f.size+'</div></div>'+scanBadge(f.scan)+'</div>';
        html += '<div class="card-bottom">'+scanAction(f.scan)+'</div></div>';
      });
      html += '</div>';
    }
    var root = document.getElementById('screen-root');
    root.innerHTML = html; root.style.display='flex'; root.style.flexDirection='column';
  }
  function scanBadge(s){
    var tone = s==='clean' ? '' : s==='infected' ? 'background:var(--critical-soft);color:var(--critical);' : 'background:var(--warn-soft);color:var(--warn);';
    return '<span class="stage-badge" style="'+tone+(s==='clean'?'background:var(--surface-3);color:var(--text-2);':'')+'">'+s+'</span>';
  }
  function scanAction(s){
    if (s==='clean') return '<span class="mono" style="color:var(--accent);font-size:12.5px;font-weight:700;">Download</span>';
    if (s==='infected') return '<span class="cell-sub">Blocked</span>';
    return '<span class="cell-sub">Scanning…</span>';
  }

  /* ---------------- AUDIT ---------------- */
  var AUDIT_EVENTS = [
    {entity:'project', action:'opened the customer record', actor:'GB', when:'2m ago'},
    {entity:'order', action:'advanced OF-Q-10388 to Production', actor:'DH', when:'18m ago'},
    {entity:'user', action:"changed Priya Nair's role to estimator", actor:'GB', when:'1h ago'},
    {entity:'project', action:'issued revision 2 on Northcote Renovation', actor:'GB', when:'3h ago'},
    {entity:'order', action:'recorded a $12,400 payment on SO-8790', actor:'DH', when:'5h ago'},
    {entity:'project', action:'downloaded Ellerslie-schedule.xlsx', actor:'GB', when:'yesterday'},
    {entity:'user', action:'signed in', actor:'DH', when:'yesterday'},
    {entity:'project', action:'requested clarification on St Heliers Extension', actor:'GB', when:'2 days ago'}
  ];
  var AUDIT_FILTERS = [{id:'', label:'All'}, {id:'project', label:'Project'}, {id:'order', label:'Order'}, {id:'user', label:'User'}];
  function renderAudit(){
    var rows = AUDIT_EVENTS.filter(function(e){ return !state.auditFilter || e.entity===state.auditFilter; });
    var html = '<div class="pagehead"><div class="eyebrow">Event log</div><h1>Audit</h1></div>';
    html += '<div class="chip-wrap">';
    AUDIT_FILTERS.forEach(function(f){
      html += '<button aria-selected="'+(state.auditFilter===f.id)+'" data-audit-filter="'+f.id+'">'+f.label+'</button>';
    });
    html += '</div>';
    html += '<div class="list-rows">';
    rows.forEach(function(e){
      html += '<div class="list-row"><span class="ent">'+e.entity+'</span><span class="act">'+e.action+'</span><span class="who">'+e.actor+' · '+e.when+'</span></div>';
    });
    html += '</div>';
    var root = document.getElementById('screen-root');
    root.innerHTML = html; root.style.display='flex'; root.style.flexDirection='column';
    document.querySelectorAll('[data-audit-filter]').forEach(function(b){
      b.addEventListener('click', function(){ state.auditFilter=b.getAttribute('data-audit-filter'); render(); });
    });
  }

  /* ---------------- ADMIN ---------------- */
  var STAFF = [
    {name:'Gediminas Bereznevicius', email:'ged@openframe.com.au', role:'admin'},
    {name:'Doni Haziraj', email:'doni@openframe.com.au', role:'admin'},
    {name:'Priya Nair', email:'priya@openframe.com.au', role:'estimator'},
    {name:'Amara Fale', email:'amara@openframe.com.au', role:'technical_reviewer'}
  ];
  var ROLES = ['admin','estimator','technical_reviewer','manager'];
  function renderAdmin(){
    var html = '<div class="pagehead"><div class="eyebrow">Access</div><h1>Admin</h1></div>';
    html += '<div class="settings-wrap" style="max-width:600px;">';
    html += '<p style="font-size:12.5px;color:var(--text-2);margin:0 0 4px;">Staff &amp; roles. Only admins can change roles.</p>';
    html += '<p class="help" style="margin-bottom:16px;">Only <strong>Admin</strong> changes what someone can do on this screen — role changes and editing a customer\'s sign-in email. Other roles are labels and don\'t restrict access.</p>';
    html += '<div class="staff-card">';
    STAFF.forEach(function(s, i){
      html += '<div class="staff-row"><div class="who"><div class="name">'+s.name+'</div><div class="email">'+s.email+'</div></div>';
      html += '<select data-staff="'+i+'">';
      ROLES.forEach(function(r){ html += '<option value="'+r+'"'+(r===s.role?' selected':'')+'>'+r+'</option>'; });
      html += '</select></div>';
    });
    html += '</div></div>';
    var root = document.getElementById('screen-root');
    root.innerHTML = html; root.style.display='flex'; root.style.flexDirection='column';
    document.querySelectorAll('[data-staff]').forEach(function(sel){
      sel.addEventListener('change', function(){ STAFF[+sel.getAttribute('data-staff')].role = sel.value; });
    });
  }

  /* ---------------- MAIN NAV: sidebar (desktop) + drawer (mobile) ---------------- */
  // One content function, two mount points — same reasoning the real
  // OpsLogo/nav share between the rail and MobileNav: the two surfaces
  // should teach the same map, not two different ones.
  function navContentHTML(forDrawer){
    var h = '<div class="sidebar-brand">';
    h += '<span class="brand">OpenFrame <small>Ops</small></span>';
    if (forDrawer) h += '<button class="icon-btn" id="drawer-close" aria-label="Close menu" style="color:rgba(255,255,255,.6);">'+svgIcon('close')+'</button>';
    h += '</div>';
    h += '<nav class="sidebar-nav">';
    NAV_ITEMS.forEach(function(n){
      h += '<button class="sidebar-item" aria-current="'+(state.screen===n.id)+'" data-nav="'+n.id+'">'+svgIcon(n.icon)+'<span>'+n.label+'</span></button>';
    });
    h += '</nav>';
    h += '<div class="sidebar-foot"><div class="who"><div class="name">Gediminas Bereznevicius</div><div class="email">ged@openframe.com.au</div></div>';
    h += '<button id="'+(forDrawer?'drawer-signout':'sidebar-signout')+'">'+svgIcon('signout')+'Sign out</button></div>';
    return h;
  }
  function renderSidebar(){
    document.getElementById('sidebar').innerHTML = navContentHTML(false);
    document.getElementById('nav-drawer').innerHTML = navContentHTML(true);
    document.querySelectorAll('[data-nav]').forEach(function(b){
      b.addEventListener('click', function(){
        closeSheet(); closeConfirm(); closeDrawer();
        state.screen = b.getAttribute('data-nav');
        // Leaving a record/detail view resets its sub-state — navigating
        // away and back should land on the list, not where you left off.
        state.projectOpen = null; state.rcDraft = null; state.customerOpen = null; state.enquiryOpen = null;
        render();
      });
    });
    var so1 = document.getElementById('sidebar-signout'), so2 = document.getElementById('drawer-signout');
    // Not wired to anything — there's no sign-in flow in this mock either,
    // so a sign-out that did something would be pretending to a state that
    // was never real. Present, inert, same as the real button's shape.
    if (so1) so1.addEventListener('click', function(e){ e.preventDefault(); });
    if (so2) so2.addEventListener('click', function(e){ e.preventDefault(); });
  }
  function openDrawer(){
    document.getElementById('nav-scrim').classList.add('on');
    document.getElementById('nav-drawer').classList.add('on');
    document.getElementById('menu-btn').setAttribute('aria-expanded', 'true');
    document.addEventListener('keydown', escCloseDrawer);
  }
  function closeDrawer(){
    document.getElementById('nav-scrim').classList.remove('on');
    document.getElementById('nav-drawer').classList.remove('on');
    document.getElementById('menu-btn').setAttribute('aria-expanded', 'false');
    document.removeEventListener('keydown', escCloseDrawer);
  }
  function escCloseDrawer(e){ if(e.key==='Escape') closeDrawer(); }

  /* ---------------- ROOT RENDER ---------------- */
  function render(){
    // Every editable field (rate-card rates, deposit %, sign-in email) calls
    // render() on its own 'input' event, because the dirty-footer and
    // computed readouts have to update as you type — but a full innerHTML
    // rebuild destroys and recreates that same input, which silently ate
    // every keystroke after the first (typing "777" left the field reading
    // "7", focus gone). Caught it by actually typing, not .fill()'ing, into
    // the field — automation shortcuts don't reproduce it. Restoring focus
    // and cursor position here fixes it for every field at once, current and
    // future, rather than patching each render function individually.
    var active = document.activeElement;
    var activeId = active && active.id;
    var selStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
    var selEnd = active && typeof active.selectionEnd === 'number' ? active.selectionEnd : null;

    document.getElementById('topbar-title').textContent = SCREEN_LABEL[state.screen];
    document.querySelectorAll('[data-nav]').forEach(function(b){ b.setAttribute('aria-current', b.getAttribute('data-nav')===state.screen); });
    var renderers = {
      dashboard: renderDashboard, projects: renderProjects, customers: renderCustomers,
      enquiries: renderEnquiries, pricing: renderPricing, files: renderFiles, audit: renderAudit, admin: renderAdmin
    };
    (renderers[state.screen] || renderDashboard)();

    if (activeId) {
      var el = document.getElementById(activeId);
      if (el && typeof el.focus === 'function') {
        el.focus();
        if (selStart != null && el.setSelectionRange) { try { el.setSelectionRange(selStart, selEnd); } catch(e){} }
      }
    }
  }

  // The actual responsiveness: measure .device's real rendered width, derive
  // state.size from it. 767.98px matches the @container breakpoint above and
  // the real app's own `md:` convention. This is the only mechanism — no
  // toggle to keep in sync with it.
  var sizeObserver = new ResizeObserver(function(entries){
    var w = entries[0].contentRect.width;
    var next = w < 768 ? 'mobile' : 'desktop';
    if (next !== state.size){ state.size = next; render(); }
  });

  document.getElementById('menu-btn').addEventListener('click', openDrawer);
  document.getElementById('nav-scrim').addEventListener('click', closeDrawer);
  document.addEventListener('click', function(e){ if (e.target && e.target.id==='drawer-close') closeDrawer(); });
  document.getElementById('sheet-close').addEventListener('click', closeSheet);
  document.getElementById('scrim').addEventListener('click', closeSheet);
  document.getElementById('confirm-scrim').addEventListener('click', closeConfirm);
  document.getElementById('editor-scrim').addEventListener('click', closeEditor);

  renderSidebar();
  render();
  sizeObserver.observe(document.getElementById('device'));
})();
</script>
