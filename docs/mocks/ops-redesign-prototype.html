<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>OpenFrame Ops — redesign prototype</title>
<style>
/* ═════════════════════════════════════════════════════════════════════════════
   1. TOKENS — ported from src/styles/theme.css. No literal colour appears in a
   rule below this block; restyling (Fluid UI 2 or anything else) is a matter of
   replacing :root, not of rewriting components.
   ═════════════════════════════════════════════════════════════════════════════ */
:root{
  /* surfaces */
  --paper:#FFFFFF; --bone:#FBFAF8; --recessive:#F5F3F0; --shade:#E8E5DF;
  --sage-wash:#F3F6F5; --sage-veil:#F7FAF8; --background:#FAFAF8;
  /* rules */
  --line:rgba(19,19,17,.18); --line-strong:rgba(19,19,17,.28);
  --rule-05:rgba(0,0,0,.05); --rule-08:rgba(0,0,0,.08); --rule-10:rgba(0,0,0,.10);
  --rule-12:rgba(0,0,0,.12); --rule-15:rgba(0,0,0,.15);
  --rule-w-08:rgba(255,255,255,.08); --rule-w-10:rgba(255,255,255,.10); --rule-w-15:rgba(255,255,255,.15);
  /* brand */
  --sage:#5A7A6A; --sage-light:#8CA99B; --sage-deep:#3f5a4c; --sage-ink:#355344; --sage-hover:#4a6858;
  /* text ramp */
  --ink:#131311; --ink-soft:#3a3835; --body:#5c5a56; --body-soft:#6f6c67;
  --quiet:#8b8880; --quieter:#9a9894; --quietest:#b5b2ac; --ink-hover:#2a2a27;
  /* chrome */
  --ops:#14150f; --ops-panel:#1d1e17; --night:#0c0c0a;
  /* states — never used alone; the word always carries it too */
  --positive:#2c7a54; --warning:#8a6a2a; --warning-ink:#7a5410;
  --attention:#C0392B; --attention-ink:#96271B; --info:#4C6A88; --info-ink:#31485f;
  --destructive:#C0392B;
  /* tone triples (from theme.css --tone-*) */
  --tone-attn:#A2610A; --tone-attn-bg:rgba(178,110,15,.10); --tone-attn-bd:rgba(178,110,15,.34);
  --tone-pos:#2C7A54;  --tone-pos-bg:rgba(44,122,84,.10);   --tone-pos-bd:rgba(44,122,84,.30);
  --tone-work:#4C6A88; --tone-work-bg:rgba(76,106,136,.10); --tone-work-bd:rgba(76,106,136,.30);
  --tone-mute:#8b897f; --tone-mute-bg:rgba(0,0,0,.045);     --tone-mute-bd:rgba(0,0,0,.12);
  /* panels */
  --panel-sage-bg:rgba(90,122,106,.06); --panel-sage-bd:rgba(90,122,106,.30);
  --panel-warn-bg:rgba(180,120,40,.09); --panel-warn-bd:rgba(180,120,40,.30);
  --panel-err-bg:rgba(180,60,40,.07);   --panel-err-bd:rgba(180,60,40,.28); --panel-err-tx:#8a3b2a;
  --chip-inf-bg:#b443361a; --chip-inf-bd:#b4433622; --chip-inf-tx:#8c2f24;
  --chip-pen-bg:#b886001a; --chip-pen-bd:#b8860022; --chip-pen-tx:#7a5c00;
  --ring-focus:var(--sage);
  /* geometry */
  --radius:2px;
  --rail-w:48px; --rail-x:200px; --drawer-w:264px;
  --pane-a:264px; --pane-c:360px; --header-h:auto; --content-max:1440px;
  /* type — widened stacks: there is no network here, so the real Space Grotesk /
     Inter never load. tabular-nums survives in every fallback, so columns stay
     aligned even though the letterforms do not. */
  --font-display:'Space Grotesk','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --font-body:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --font-data:var(--font-display);
  --t-hd2:22px; --t-hd2-lh:28px; --t-hd3:17px; --t-hd3-lh:24px;
  --t-bdlg:18px; --t-bdlg-lh:28px; --t-bd:16px; --t-bd-lh:24px;
  --t-bdsm:14px; --t-bdsm-lh:20px; --t-cap:13px; --t-cap-lh:18px;
  --t-lbl:11px; --t-lbl-lh:14px; --t-lbl-track:1px;
  --t-dat:14px; --t-dat-lh:20px; --t-datsm:12px; --t-datsm-lh:16px;
}

/* ═════════════════════════════════════════════════════════════════════════════
   2. BASE CONTRACT
   ═════════════════════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;border:0 solid var(--line);}
html,body{height:100%;margin:0;}
body{
  background:var(--background); color:var(--ink);
  font:400 var(--t-bdsm)/var(--t-bdsm-lh) var(--font-body);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;margin:0;}
p{margin:0;}
button,input,select,textarea{font:inherit;color:inherit;background:none;}
button{cursor:pointer;padding:0;text-align:left;}
button:disabled{cursor:not-allowed;}
a{color:var(--sage);text-decoration:none;}
a:hover{text-decoration:underline;text-underline-offset:2px;}
ul,ol{margin:0;padding:0;list-style:none;}
table{border-collapse:collapse;width:100%;}
:focus-visible{outline:2px solid var(--ring-focus);outline-offset:2px;}
[hidden]{display:none!important;}
::selection{background:var(--sage-wash);}

/* type utilities — 1:1 with theme.css */
.t-hd2{font:600 var(--t-hd2)/var(--t-hd2-lh) var(--font-display);letter-spacing:-.01em;}
.t-hd3{font:600 var(--t-hd3)/var(--t-hd3-lh) var(--font-display);}
.t-bd-lg{font:400 var(--t-bdlg)/var(--t-bdlg-lh) var(--font-body);}
.t-bd{font:400 var(--t-bd)/var(--t-bd-lh) var(--font-body);}
.t-bd-sm{font:400 var(--t-bdsm)/var(--t-bdsm-lh) var(--font-body);}
.t-cap{font:400 var(--t-cap)/var(--t-cap-lh) var(--font-body);}
.t-label{font:600 var(--t-lbl)/var(--t-lbl-lh) var(--font-data);letter-spacing:var(--t-lbl-track);text-transform:uppercase;}
.t-data{font:500 var(--t-dat)/var(--t-dat-lh) var(--font-data);font-variant-numeric:tabular-nums;}
.t-data-sm{font:500 var(--t-datsm)/var(--t-datsm-lh) var(--font-data);font-variant-numeric:tabular-nums;}
.font-display{font-family:var(--font-display);}
.font-data{font-family:var(--font-data);font-variant-numeric:tabular-nums;}
.ink{color:var(--ink);} .ink-soft{color:var(--ink-soft);} .body-tx{color:var(--body);}
.quiet{color:var(--quiet);} .quietest{color:var(--quietest);} .sage-tx{color:var(--sage);}
.warn-tx{color:var(--warning-ink);} .attn-tx{color:var(--attention-ink);}
.right{text-align:right;} .nowrap{white-space:nowrap;}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* the card fill derives from its ground — an author never picks a card colour */
.ground-bone{background:var(--bone);--card-fill:var(--paper);}
.ground-paper{background:var(--paper);--card-fill:var(--bone);}
.card{border:1px solid var(--line);background:var(--card-fill,var(--bone));}

/* ═════════════════════════════════════════════════════════════════════════════
   3. SHELL — of-app-frame / of-rail
   ═════════════════════════════════════════════════════════════════════════════ */
.of-app-frame{display:flex;height:100%;overflow:hidden;}
.of-rail{
  width:var(--rail-w);flex:0 0 var(--rail-w);background:var(--ops);color:#fff;
  display:flex;flex-direction:column;position:relative;z-index:40;
}
.of-rail[data-pinned="1"]{width:var(--rail-x);flex-basis:var(--rail-x);}
.of-rail-inner{position:absolute;inset:0 auto 0 0;width:var(--rail-w);background:var(--ops);
  display:flex;flex-direction:column;transition:width .12s ease-out;overflow:hidden;}
.of-rail:hover .of-rail-inner,.of-rail:focus-within .of-rail-inner,
.of-rail[data-pinned="1"] .of-rail-inner{width:var(--rail-x);box-shadow:2px 0 0 rgba(0,0,0,.10);}
.of-rail-head{height:48px;display:flex;align-items:center;gap:8px;padding:0 12px;
  border-bottom:1px solid var(--rule-w-10);flex:0 0 48px;}
.of-mark{width:24px;height:24px;flex:0 0 24px;display:grid;place-items:center;
  border:1px solid var(--rule-w-15);color:var(--sage-light);}
.of-rail-word{color:#fff;opacity:.55;white-space:nowrap;}
.of-rail-nav{padding:8px 0;flex:1;overflow-y:auto;overflow-x:hidden;}
.of-rail-item{width:100%;height:44px;display:flex;align-items:center;gap:12px;padding:0 13px;
  color:rgba(255,255,255,.50);border-left:2px solid transparent;white-space:nowrap;}
.of-rail-item:hover{color:rgba(255,255,255,.80);}
.of-rail-item[aria-current="page"]{color:#fff;background:var(--rule-w-08);border-left-color:var(--sage);}
.of-rail-ico{width:20px;flex:0 0 20px;display:grid;place-items:center;font-family:var(--font-data);font-size:13px;}
.of-rail-count{margin-left:auto;font:500 11px/1 var(--font-data);color:rgba(255,255,255,.45);
  border:1px solid var(--rule-w-15);padding:2px 5px;}
.of-rail-lane{border-top:1px solid var(--rule-w-10);padding:10px 13px;color:rgba(255,255,255,.55);white-space:nowrap;}
.of-rail-lane-btns{display:flex;gap:4px;margin-top:6px;}
.of-rail-lane-btns button{width:28px;height:24px;border:1px solid var(--rule-w-15);
  color:rgba(255,255,255,.75);display:grid;place-items:center;}
.of-rail-lane-btns button:hover{background:var(--rule-w-08);}
.of-rail-foot{border-top:1px solid var(--rule-w-10);padding:10px 13px;white-space:nowrap;}
.of-rail-foot .nm{color:#fff;} .of-rail-foot .em{color:rgba(255,255,255,.40);}
.of-rail-foot button{color:rgba(255,255,255,.55);margin-top:8px;display:flex;align-items:center;gap:8px;}
.of-rail-foot button:hover{color:#fff;}
.of-content{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bone);}
.of-menu-btn{display:none;}

/* ── The other axis ──────────────────────────────────────────────────────────
   Pane A is itself a navigation rail — a list you pick from — so a nav rail
   beside it stacks two rails and the eye has to work out which is which. A top
   bar does not compete, because below it every vertical division means content.
   Press L to switch and judge it. */
.of-app-frame[data-nav="top"]{flex-direction:column;}
.of-topbar{height:48px;flex:0 0 48px;background:var(--ops);color:#fff;display:flex;align-items:center;
  gap:2px;padding:0 10px 0 14px;}
.of-topbar .of-mark{margin-right:8px;}
.of-top-item{height:48px;display:flex;align-items:center;padding:0 12px;white-space:nowrap;
  color:rgba(255,255,255,.50);box-shadow:inset 0 -2px 0 transparent;}
.of-top-item:hover{color:rgba(255,255,255,.80);}
.of-top-item[aria-current="page"]{color:#fff;background:var(--rule-w-08);box-shadow:inset 0 -2px 0 var(--sage);}
.of-top-item .of-rail-count{margin-left:7px;}
.of-top-right{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0;}
.of-top-search{display:flex;align-items:center;gap:8px;color:rgba(255,255,255,.45);
  border:1px solid var(--rule-w-15);padding:5px 9px;}
.of-top-search:hover{color:rgba(255,255,255,.75);}
.of-top-id{display:flex;align-items:center;gap:8px;padding-left:8px;border-left:1px solid var(--rule-w-10);}
.of-top-id .nm{color:rgba(255,255,255,.75);max-width:170px;}
.of-top-id button{color:rgba(255,255,255,.45);}
.of-top-id button:hover{color:#fff;}
.of-top-menu{display:none;width:44px;height:44px;place-items:center;color:rgba(255,255,255,.75);}
/* The lane stepper belongs to the record, not to the app — with no rail to hide
   in, it sits beside "← Work" where it was always about to belong. */
.of-lane-step{display:inline-flex;align-items:center;gap:4px;margin-left:10px;color:var(--quiet);}
.of-lane-step button{border:1px solid var(--rule-12);width:24px;height:20px;display:grid;place-items:center;color:var(--body);}
.of-lane-step button:hover{background:var(--bone);}
@media (max-width:1180px){ .of-top-search .label{display:none;} .of-top-id .nm{display:none;} }
@media (max-width:900px){ .of-top-item{padding:0 9px;} }

/* ═════════════════════════════════════════════════════════════════════════════
   4. PAGE ARCHETYPES — of-queue-page (scrolls) / of-record-page (does not)
   ═════════════════════════════════════════════════════════════════════════════ */
.of-queue-page{flex:1;overflow-y:auto;}
.of-queue-inner{max-width:var(--content-max);margin:0 auto;padding:0 24px 40px;}
.of-page-head{height:56px;display:flex;align-items:center;gap:16px;position:sticky;top:0;
  background:var(--bone);z-index:5;}
.of-page-head h1{font:600 var(--t-hd3)/var(--t-hd3-lh) var(--font-display);}
.of-search-stub{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--quiet);
  border:1px solid var(--rule-12);padding:6px 10px;background:var(--paper);min-width:240px;}
.of-kbd{font:500 11px/1 var(--font-data);border:1px solid var(--rule-15);padding:3px 5px;color:var(--quiet);}
.of-views{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 12px;}
.of-view{padding:6px 10px;border:1px solid var(--rule-12);background:var(--paper);color:var(--body);white-space:nowrap;}
.of-view[aria-pressed="true"]{background:var(--sage);border-color:var(--sage);color:#fff;}
.of-view .n{font-family:var(--font-data);font-variant-numeric:tabular-nums;opacity:.8;margin-left:6px;}
.of-foot-strip{margin-top:14px;padding:12px 0;border-top:1px solid var(--rule-08);color:var(--quiet);}

.of-record-page{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bone);}

/* ═════════════════════════════════════════════════════════════════════════════
   5. LISTS — of-row-list with column-priority folding
   ═════════════════════════════════════════════════════════════════════════════ */
.of-row-list{border:1px solid var(--line);background:var(--paper);}
.of-row-list thead th{
  font:600 var(--t-lbl)/var(--t-lbl-lh) var(--font-data);letter-spacing:var(--t-lbl-track);
  text-transform:uppercase;color:var(--quiet);text-align:left;padding:10px 12px;
  border-bottom:1px solid var(--rule-08);white-space:nowrap;
}
.of-row-list tbody tr{border-bottom:1px solid var(--rule-05);cursor:pointer;}
.of-row-list tbody tr:last-child{border-bottom:0;}
.of-row-list tbody tr:hover{background:var(--bone);}
.of-row-list tbody tr[aria-selected="true"]{background:var(--sage-wash);}
.of-row-list td{padding:10px 12px;vertical-align:top;}
.of-row-list .sub{display:block;color:var(--quiet);font:400 var(--t-cap)/var(--t-cap-lh) var(--font-body);}
.of-row-list .meta-fold{display:none;}

/* ═════════════════════════════════════════════════════════════════════════════
   6. STATUS, TONE, STATE
   ═════════════════════════════════════════════════════════════════════════════ */
.of-chip{display:inline-flex;align-items:center;gap:5px;padding:2px 7px;border:1px solid;
  font:400 var(--t-cap)/1.35 var(--font-body);white-space:nowrap;}
.of-chip[data-tone="pos"]{color:var(--tone-pos);background:var(--tone-pos-bg);border-color:var(--tone-pos-bd);}
.of-chip[data-tone="attn"]{color:var(--tone-attn);background:var(--tone-attn-bg);border-color:var(--tone-attn-bd);}
.of-chip[data-tone="work"]{color:var(--tone-work);background:var(--tone-work-bg);border-color:var(--tone-work-bd);}
.of-chip[data-tone="mute"]{color:var(--tone-mute);background:var(--tone-mute-bg);border-color:var(--tone-mute-bd);}
.of-chip[data-tone="stop"]{color:var(--attention-ink);background:var(--panel-err-bg);border-color:var(--panel-err-bd);}
.of-status-word{font:400 var(--t-cap)/var(--t-cap-lh) var(--font-body);}
.of-status-word[data-tone="pos"]{color:var(--tone-pos);}
.of-status-word[data-tone="attn"]{color:var(--tone-attn);}
.of-status-word[data-tone="work"]{color:var(--tone-work);}
.of-status-word[data-tone="mute"]{color:var(--quiet);}
.of-status-word[data-tone="stop"]{color:var(--attention-ink);}

.of-banner{border:1px solid;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;}
.of-banner[data-tone="warn"]{background:var(--panel-warn-bg);border-color:var(--panel-warn-bd);color:var(--warning-ink);}
.of-banner[data-tone="err"]{background:var(--panel-err-bg);border-color:var(--panel-err-bd);color:var(--panel-err-tx);}
.of-banner[data-tone="info"]{background:var(--panel-sage-bg);border-color:var(--panel-sage-bd);color:var(--sage-ink);}

.of-state{border:1px dashed var(--rule-15);background:var(--paper);padding:40px 24px;text-align:center;color:var(--body);}
.of-state .hint{color:var(--quiet);margin-top:4px;}
.of-state[data-kind="error"]{border-style:solid;border-color:var(--panel-err-bd);background:var(--panel-err-bg);color:var(--panel-err-tx);}
.of-skel{height:12px;background:var(--shade);animation:pulse 1.2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:.9}}

/* absence — a first-class primitive. An unset value is content, not a blank. */
.of-absence{color:var(--quiet);font:400 var(--t-cap)/var(--t-cap-lh) var(--font-body);font-style:normal;}
.of-absence::before{content:"— ";color:var(--quietest);}

/* ═════════════════════════════════════════════════════════════════════════════
   7. RECORD CHROME — header band, ribbon, action bar
   ═════════════════════════════════════════════════════════════════════════════ */
.of-record-header{background:var(--paper);border-bottom:1px solid var(--line);flex:0 0 auto;}
.of-rh-inner{padding:12px 20px 10px;}
.of-rh-top{display:flex;gap:24px;align-items:flex-start;}
.of-back{color:var(--sage);display:inline-flex;align-items:center;gap:6px;margin-bottom:6px;}
.of-eyebrow{color:var(--quiet);}
.of-eyebrow b{color:var(--body);font-weight:500;font-family:var(--font-data);}
.of-rh-metrics{margin-left:auto;display:flex;gap:28px;flex-wrap:wrap;justify-content:flex-end;}
.of-metric{min-width:96px;}
.of-metric .k{color:var(--quiet);}
.of-metric .v{color:var(--ink);margin-top:2px;}
.of-metric .c{color:var(--quiet);}
.of-ribbon{display:flex;margin:10px 0 6px;border:1px solid var(--rule-12);}
.of-ribbon-cell{flex:1;padding:5px 8px;text-align:center;color:var(--quiet);border-right:1px solid var(--rule-08);
  font:600 var(--t-lbl)/var(--t-lbl-lh) var(--font-data);letter-spacing:var(--t-lbl-track);text-transform:uppercase;}
.of-ribbon-cell:last-child{border-right:0;}
.of-ribbon-cell[data-state="done"]{color:var(--body);background:var(--recessive);}
.of-ribbon-cell[data-state="now"]{color:#fff;background:var(--sage);}
.of-ribbon-caption{color:var(--body);}
.of-freshness{color:var(--quiet);text-align:right;white-space:nowrap;}
.of-action-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;}
.of-btn{border:1px solid var(--rule-15);padding:7px 12px;color:var(--ink-soft);background:var(--paper);white-space:nowrap;}
.of-btn:hover:not(:disabled){background:var(--bone);}
.of-btn[data-variant="primary"]{background:var(--sage);border-color:var(--sage);color:#fff;}
.of-btn[data-variant="primary"]:hover:not(:disabled){background:var(--sage-hover);}
.of-btn[data-variant="ghost"]{border-color:transparent;color:var(--sage);padding-left:4px;padding-right:4px;}
.of-btn:disabled{opacity:.5;}
.of-blocked{color:var(--warning-ink);}
.of-confirm{margin-top:10px;border:1px solid var(--panel-sage-bd);background:var(--panel-sage-bg);padding:12px;}
.of-confirm textarea{width:100%;border:1px solid var(--rule-15);background:var(--paper);padding:8px;margin-top:8px;min-height:64px;resize:vertical;}

/* ═════════════════════════════════════════════════════════════════════════════
   8. THE THREE PANES
   ═════════════════════════════════════════════════════════════════════════════ */
.of-pane-group{flex:1;display:flex;min-height:0;overflow:hidden;}
.of-pane{overflow-y:auto;min-height:0;}
.of-pane-a{flex:0 0 var(--pane-a);width:var(--pane-a);border-right:1px solid var(--line);background:var(--paper);}
.of-pane-b{flex:1;min-width:0;background:var(--paper);}
.of-pane-c{flex:0 0 var(--pane-c);width:var(--pane-c);border-left:1px solid var(--line);background:var(--bone);}
.of-pane-group[data-collapse-a="1"] .of-pane-a{flex-basis:44px;width:44px;}
.of-pane-group[data-collapse-c="1"] .of-pane-c{display:none;}
.of-pane-head{position:sticky;top:0;background:inherit;padding:10px 14px;border-bottom:1px solid var(--rule-08);
  display:flex;align-items:baseline;gap:8px;z-index:2;}
.of-pane-head .n{margin-left:auto;color:var(--quiet);font-family:var(--font-data);}

/* pane A — openings */

.of-record-chip{width:100%;padding:9px 12px;border-bottom:1px solid var(--rule-08);border-left:2px solid transparent;

.of-unit-row{width:100%;display:flex;gap:8px;padding:5px 12px 5px 34px;border-bottom:1px solid var(--rule-05);color:var(--body);}
.of-unit-row .ix{color:var(--quietest);font-family:var(--font-data);}
.of-pane-a-foot{padding:12px;color:var(--quiet);border-top:1px solid var(--rule-08);}
.of-elev{display:block;}

/* pane B — the opening */
.of-b-inner{padding:16px 20px 48px;max-width:940px;}
.of-block{border-top:1px solid var(--rule-08);padding-top:14px;margin-top:16px;}
.of-block:first-child{border-top:0;padding-top:0;margin-top:0;}
.of-block-h{color:var(--quiet);margin-bottom:8px;display:flex;align-items:baseline;gap:8px;}
.of-elev-stage{border:1px solid var(--rule-08);background:var(--bone);padding:18px;display:grid;place-items:center;}
.of-honesty{color:var(--quiet);margin-top:8px;max-width:62ch;}
.of-spec{width:100%;}
.of-spec td{padding:5px 0;vertical-align:top;border-bottom:1px solid var(--rule-05);}
.of-spec td:first-child{color:var(--quiet);width:190px;}
.of-spec tr:last-child td{border-bottom:0;}
.of-units td{padding:6px 8px;border-bottom:1px solid var(--rule-05);vertical-align:top;}
.of-units th{padding:6px 8px;color:var(--quiet);text-align:left;
  font:600 var(--t-lbl)/var(--t-lbl-lh) var(--font-data);letter-spacing:var(--t-lbl-track);text-transform:uppercase;}
.of-ledger{width:100%;}
.of-ledger th{text-align:left;color:var(--quiet);padding:4px 8px;
  font:600 var(--t-lbl)/var(--t-lbl-lh) var(--font-data);letter-spacing:var(--t-lbl-track);text-transform:uppercase;}
.of-ledger td{padding:5px 8px;border-bottom:1px solid var(--rule-05);}
.of-ledger tr[data-changed="1"] td:first-child,
.of-ledger tr[data-changed="1"] td:nth-child(2){box-shadow:inset 2px 0 0 var(--sage);}
.of-check{display:flex;gap:9px;align-items:flex-start;padding:10px;border:1px solid var(--panel-warn-bd);background:var(--panel-warn-bg);}
.of-check input{margin-top:3px;}
.of-price{font:600 var(--t-hd2)/var(--t-hd2-lh) var(--font-display);color:var(--ink);}
.of-editor{border:1px solid var(--panel-sage-bd);background:var(--sage-veil);padding:14px;margin-top:14px;}
.of-field{display:block;margin-bottom:10px;}
.of-field .lbl{color:var(--quiet);display:block;margin-bottom:3px;}
.of-field input,.of-field select{width:100%;border:1px solid var(--line-strong);background:var(--paper);padding:6px 8px;}

.of-flow-who{color:var(--quiet);white-space:nowrap;padding-left:12px;}

   ═════════════════════════════════════════════════════════════════════════════ */

.of-sheet{position:fixed;left:50%;top:8vh;transform:translateX(-50%);width:min(680px,92vw);max-height:80vh;overflow:auto;

}

};

const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const money0 = (n) => n == null ? "—" : "$" + Math.round(n).toLocaleString("en-AU");
const money2 = (n) => n == null ? "—" : "$" + n.toLocaleString("en-AU",{minimumFractionDigits:2,maximumFractionDigits:2});
const mm = (n) => n == null ? "—" : n.toLocaleString("en-AU");
const bytes = (n) => n < 1024 ? n + " B" : n < 1048576 ? Math.round(n/1024) + " KB"
  : (n/1048576).toFixed(1) + " MB";           /* the MB tier the live Files table lacks */
const humanise = (s) => s == null ? "" : String(s).replace(/_/g," ").replace(/^./, (c)=>c.toUpperCase());
const plural = (n, one, many) => n === 1 ? one : many;
const proj = (id) => DATA.projects.find(p => p.id === id);
const linesOf = (id) => DATA.lines[id] || [];

/* A count is a FILTER OVER THE ROWS, never a separate number that can drift from
   them. The live console computes "unresolved" in SQL and the list from another
   query, so "3 lines are unresolved" can sit above four unresolved lines. Here
   the gate is counted from the lines the reviewer can see. */
function unresolvedOf(p) {
  const ls = linesOf(p.id);
  if (!ls.length) return p.unresolved;
  return ls.filter(l => l.status !== "ready").length;
}

/* The state word. Never colour alone — the word IS the value. */
const STATE_WORD = { ready:["ready","pos"], needs_review:["needs review","attn"],
                     unpriced:["unpriced","stop"], draft:["draft","mute"] };
const stateWord = (s) => {
  const [w,t] = STATE_WORD[s] || [humanise(s),"mute"];
  return `<span class="of-status-word" data-tone="${t}">${esc(w)}</span>`;
};

/* Review flags → the server's own sentences (worker/routes/ops.ts reviewReasons). */
const REVIEW_REASON = {
  customerConfigurationChanged: "Customer split opening into three child products",
  thermalRecommendation:        "Thermal configuration",
  noLongerInDocuments:          "No longer in current documents",
  noPriceableConfiguration:     "No priceable configuration was available",
  mixedFrameSystems:            "Frames of different depth do not couple, so they cannot be joined in one opening",
};
const reasonsOf = (line) => Object.keys(line.review || {}).filter(k => line.review[k]).map(k => REVIEW_REASON[k] || k);

/* ── The elevation ──────────────────────────────────────────────────────────
   Drawn from the configured size and its units — NOT traced from any uploaded
   document. The sentence under it says so, every time; that one sentence is the
   difference between a provenance tool and a prop. */
function elevation(line, w, h, opts) {
  opts = opts || {};
  const units = line.units && line.units.length ? line.units : [{n:1,type:"fixed",span:line.width||1}];
  const total = units.reduce((a,u)=>a+(u.span||1),0) || 1;
  const pad = opts.dims ? 30 : 3;
  const iw = w - pad*2, ih = h - pad*2;
  if (!line.width || !line.height) {
    return `<svg class="of-elev" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-label="No size recorded"
      style="opacity:.55"><rect x="${pad}" y="${pad}" width="${iw}" height="${ih}" fill="none"
      stroke="var(--quietest)" stroke-width="1" stroke-dasharray="3 3"/></svg>`;
  }
  const ratio = line.height / line.width;
  let dw = iw, dh = iw * ratio;
  if (dh > ih) { dh = ih; dw = ih / ratio; }
  const x0 = pad + (iw - dw)/2, y0 = pad + (ih - dh)/2;
  let x = x0, parts = "";
  units.forEach((u) => {
    const uw = dw * ((u.span||1)/total);
    parts += `<rect x="${x.toFixed(1)}" y="${y0.toFixed(1)}" width="${uw.toFixed(1)}" height="${dh.toFixed(1)}"
      fill="var(--paper)" stroke="var(--ink)" stroke-width="1"/>`;
    parts += symbol(u.type, x, y0, uw, dh);
    x += uw;
  });
  let dims = "";
  if (opts.dims) {
    const cy = y0 + dh/2;
    dims = `
      <line x1="${x0}" y1="${(y0+dh+12).toFixed(1)}" x2="${(x0+dw).toFixed(1)}" y2="${(y0+dh+12).toFixed(1)}"
        stroke="var(--quiet)" stroke-width="1"/>
      <text x="${(x0+dw/2).toFixed(1)}" y="${(y0+dh+26).toFixed(1)}" text-anchor="middle"
        font-family="var(--font-data)" font-size="11" fill="var(--body)">${mm(line.width)} wide</text>
      <line x1="${(x0-12).toFixed(1)}" y1="${y0}" x2="${(x0-12).toFixed(1)}" y2="${(y0+dh).toFixed(1)}"
        stroke="var(--quiet)" stroke-width="1"/>
      <text x="${(x0-16).toFixed(1)}" y="${cy.toFixed(1)}" text-anchor="middle"
        font-family="var(--font-data)" font-size="11" fill="var(--body)"
        transform="rotate(-90 ${(x0-16).toFixed(1)} ${cy.toFixed(1)})">${mm(line.height)} high</text>`;
    units.forEach((u,i) => {
      let ux = x0; for (let k=0;k<i;k++) ux += dw*((units[k].span||1)/total);
      const uw = dw*((u.span||1)/total);
      dims += `<text x="${(ux+uw/2).toFixed(1)}" y="${(y0+dh+10).toFixed(1)}" text-anchor="middle"
        font-family="var(--font-data)" font-size="10" fill="var(--quiet)">${mm(u.span)}</text>`;
    });
  }
  return `<svg class="of-elev" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"
    role="img" aria-label="${esc(line.code)} — ${units.length} ${plural(units.length,"unit","units")},
    ${mm(line.width)} by ${mm(line.height)} millimetres">${parts}${dims}</svg>`;
}
/* Opening symbols: the apex points at the hinge. Fixed lights carry none, which
   is itself the convention — an empty panel is a fixed panel. */
function symbol(type, x, y, w, h) {
  const st = `stroke="var(--body)" stroke-width="1" fill="none"`;
  const m = 2, x1 = x+m, y1 = y+m, x2 = x+w-m, y2 = y+h-m, cx = x+w/2, cy = y+h/2;
  switch (type) {
    case "awning":      return `<path d="M${x1} ${y2} L${cx} ${y1} L${x2} ${y2}" ${st}/>`;
    case "casement":    return `<path d="M${x2} ${y1} L${x1} ${cy} L${x2} ${y2}" ${st}/>`;
    case "hinged":      return `<path d="M${x1} ${y1} L${x2} ${cy} L${x1} ${y2}" ${st}/>`;
    case "sliding":
    case "slidingdoor": return `<path d="M${cx-w*0.22} ${cy} L${cx+w*0.22} ${cy} M${cx+w*0.22} ${cy}
                                 l-4 -4 M${cx+w*0.22} ${cy} l-4 4" ${st}/>`;
    default:            return "";
  }
}

/* ── Absence — a first-class primitive ─────────────────────────────────────── */
const absence = (t) => `<span class="of-absence">${esc(t)}</span>`;

   C. ROUTER — every screen has a URL; back/forward and refresh all work.

const VIEWS = [
  { id:"needs-us",  label:"Needs us",         pred:r => r.waitingOn === "Us" },
  { id:"submitted", label:"Submitted",        pred:r => r.stateLabel === "Submitted" },
  { id:"pricing",   label:"Being priced",     pred:r => r.phase === "Pricing" },
  { id:"ready",     label:"Ready to issue",   pred:r => r.phase === "Pricing" && unresolvedOf(r) === 0 },
  { id:"payment",   label:"Awaiting payment",
    pred:r => r.stateLabel === "Deposit invoice issued" || r.stateLabel === "Final balance invoice issued" },
  { id:"customer",  label:"Awaiting customer",pred:r => r.waitingOn === "Customer" },
  { id:"production",label:"In production",    pred:r => r.phase === "Production" || r.phase === "Accepted" },
  { id:"open",      label:"All open",         pred:r => r.phase !== "Delivered" },
  { id:"all",       label:"All",              pred:() => true },
];

function parseHash() {
  const raw = (location.hash || "#/work/needs-us").replace(/^#/, "");
  const [path, qs] = raw.split("?");
  const q = new URLSearchParams(qs || "");
  const seg = path.split("/").filter(Boolean);
  const r = { name: seg[0] || "work", view:null, id:null, scope:"opening", line:null, tab:null, sub:null };
  if (r.name === "work")      { r.view = seg[1] || "needs-us"; }
  else if (r.name === "r")    { r.id = seg[1] || null; r.line = seg[2] || null;
                                r.scope = q.get("scope") === "record" ? "record" : "opening";
                                r.tab = q.get("tab") || "flow"; r.sub = q.get("view") || null; }
  else if (r.name === "leads"){ r.view = seg[1] || "all"; r.id = seg[2] || null; }
  else if (r.name === "customers"){ r.id = seg[1] || null; }
  else if (r.name === "products") { r.view = seg[1] || "cards"; r.id = seg[2] || null; r.sub = q.get("q"); }
  else if (r.name === "archive")  { r.view = seg[1] || "files"; r.sub = q.get("entity") || ""; }
  else if (r.name === "settings") { r.view = seg[1] || "staff"; }
  return r;
}
function go(hash) { location.hash = hash; }
function syncRoute() {
  S.route = parseHash();
  if (S.route.name === "r" && !S.route.line && S.route.scope === "opening") {
    const l = linesOf(S.route.id)[0]; if (l) S.route.line = l.id;
  }
  render();
}

/* ═════════════════════════════════════════════════════════════════════════════
   THE REVIEW WORKSPACE — the screen everything else is judged against.
   264 : fluid : 360, three independent scroll contexts, a header that never
   scrolls away from the action it gates.
   ═════════════════════════════════════════════════════════════════════════════ */
const PHASES = ["Intake","Pricing","Issued","Accepted","Production","Delivered"];
const EDITABLE_STATES = ["submitted","triage_pending","estimator_assigned",
                         "technical_review_required","customer_clarification_required"];
const isEditable = (p) => !S.flags.readonly && EDITABLE_STATES.includes(p.statusInternal);

function renderRecord() {
  const p = proj(S.route.id);
  if (!p) return `<div class="of-record-page"><div class="of-state" data-kind="error">
    <p class="t-bd-sm">Couldn't load this record.</p><p class="hint t-cap">HTTP 404 — not_found</p></div></div>`;
  const lines = linesOf(p.id);
  const recordScope = S.route.scope === "record";
  const line = lines.find(l => l.id === S.route.line) || lines[0];

  return `<div class="of-record-page">
    ${recordHeader(p, lines)}
    <div class="of-pane-group" data-collapse-a="${S.collapseA?1:0}" data-collapse-c="${S.collapseC?1:0}"
         data-drawer-c="${S.drawerC?1:0}">
      ${paneA(p, lines, line, recordScope)}
      ${S.sheetView ? paneSheet(p, lines, line)
        : S.route.sub === "thermal" ? paneThermal(p, lines, line)
        : recordScope ? paneRecordB(p, lines) : paneB(p, line)}
      ${recordScope ? paneRecordC(p, lines) : paneC(p, line)}
    </div>
  </div>`;
}

/* ── The header band — fixed. The primary action and the reason it is blocked
   must never be scrolled away from the thing that blocks it. ───────────────── */
function recordHeader(p, lines) {
  const hasOrder = !!p.orderNo;
  const unresolved = unresolvedOf(p);
  const ready = p.lineCount - unresolved;
  const phaseIx = PHASES.indexOf(p.phase);
  const acts = actionsFor(p);
  const primary = acts.find(a => a.primary);

  /* I14 — unresolvedLineCount counts DRAFT lines. Once an order exists those
     rows are contract lines flattened to ready, so the ratio would divide a
     stale draft count by a contract count. The metric changes rather than lies. */
  const gate = hasOrder
    ? `<div class="of-metric"><div class="k t-label">Contract lines</div>
         <div class="v t-bd font-data">${p.lineCount}</div>
         <div class="c t-cap">frozen at acceptance</div></div>`
    : `<div class="of-metric"><div class="k t-label">Lines ready</div>
         <div class="v t-bd font-data">${ready} of ${p.lineCount}</div>
         <div class="c t-cap">${unresolved ? `${unresolved} unpriced or unresolved` : "all settled"}</div></div>`;

  return `<header class="of-record-header"><div class="of-rh-inner">
    <div class="of-rh-top">
      <div style="min-width:0">
        <button class="of-back t-cap" data-act="goto" data-href="#/work/${S.lane||"needs-us"}">← Work</button>
        ${S.nav === "top" ? laneStepper() : ""}

          Proposal · <b>${esc(p.ref || p.id.slice(0,8))}</b>${!p.ref ? " (no public ref — showing the id)" : ""}
          ${hasOrder ? ` &nbsp;·&nbsp; Order · <b>${esc(p.orderNo)}</b>` : " &nbsp;·&nbsp; Order · —"}
          <button class="of-btn" data-variant="ghost" data-act="copy" title="Copy this URL">copy link</button>
        </div>
        <h1 class="t-bd-lg" style="margin-top:2px">${esc(p.title)}</h1>
        <p class="quiet t-cap">${[p.org, p.customerName, p.customerEmail].filter(Boolean).map(esc).join(" · ") || "submit-time contact only"}</p>
      </div>
      <div class="of-rh-metrics">
        <div class="of-metric"><div class="k t-label">Customer</div>
          <div class="v t-bd-sm">${esc(p.org || p.customerName || "(anonymous)")}</div></div>
        <div class="of-metric"><div class="k t-label">Value</div>
          <div class="v t-bd font-data">${money0(p.value)}</div>
          <div class="c t-cap">${p.valueBasis === "estimate" ? "estimate" : esc(p.valueBasis)}</div></div>
        ${gate}
        <div class="of-metric"><div class="k t-label">Customer sees</div>
          <div class="v t-bd-sm">${esc(humanise(p.statusCustomer))}</div></div>

    </div>

            data-state="${i < phaseIx ? "done" : i === phaseIx ? "now" : "todo"}">${ph}</div>`).join("")}
        </div>
        <p class="of-ribbon-caption t-cap">Now · ${esc(p.stateLabel)} · waiting on ${p.waitingOn.toLowerCase()} ·
          ${p.daysInStage} ${plural(p.daysInStage,"day","days")} since this record was last touched</p>
      </div>
      <div class="of-freshness t-cap">
        Last audited change · ${esc(p.lastChange.actor)} · ${esc(p.lastChange.when)}<br>
        as of 14:32 <button class="of-btn" data-variant="ghost" data-act="noop">⟳ Refresh</button>
      </div>
    </div>

    <div class="of-action-bar">
      ${acts.map(a => `<button class="of-btn t-bd-sm" ${a.primary ? 'data-variant="primary"' : ""}
        ${a.blocked ? "disabled" : ""} data-act="action" data-id="${a.id}">${esc(a.label)}</button>
        ${a.blocked ? `<span class="of-blocked t-cap">${esc(a.blocked)}</span>` : ""}`).join("")}
      ${S.flags.conflict ? `<span class="of-blocked t-cap" style="margin-left:auto">1 error · show</span>` : ""}
    </div>
    ${S.confirm ? confirmInline(S.confirm) : ""}
    ${S.flags.conflict ? `<div class="of-banner t-bd-sm" data-tone="err" style="margin-top:10px">
      <span aria-hidden="true">⚠</span>
      <span>Someone else changed this line — the edit that beat you may not have written an audit row.
        Your typed values are kept below.
        <button class="of-btn" data-variant="ghost" data-act="clear-conflict">Reload this record</button></span></div>` : ""}
    ${unresolved && !hasOrder ? `<div class="of-banner t-bd-sm" data-tone="warn" style="margin-top:10px">
      <span aria-hidden="true">⚠</span><span>${unresolved} ${plural(unresolved,"line is","lines are")} unpriced or unresolved —
      a quote cannot be issued until ${plural(unresolved,"it is","they are")} settled.</span></div>` : ""}
  </div></header>`;
}

/* Actions are derived from the state, exactly as the server derives them, and
   a blocked primary states its reason beside itself rather than vanishing. */
function actionsFor(p) {
  const out = [];
  if (p.orderNo) {
    const stage = p.statusInternal;
    if (stage === "deposit_invoiced") out.push({ id:"pay-deposit", label:"Record deposit payment", primary:true });
    if (stage === "manufacturing")    out.push({ id:"qa", label:"Confirm QA and invoice the balance", primary:true });
    if (stage === "after_sales")      out.push({ id:"close", label:"Close the job", primary:true });
    out.push({ id:"note", label:"Add a note" });
    return out;
  }
  switch (p.statusInternal) {
    case "submitted":
      out.push({ id:"start", label:"Start pricing", primary:true });
      out.push({ id:"clarify", label:"Request clarification" });
      break;
    case "estimator_assigned":
    case "technical_review_required":
      out.push({ id:"issue", label:"Issue reviewed quote", primary:true,
                 blocked: unresolvedOf(p) ? `${unresolvedOf(p)} ${plural(unresolvedOf(p),"line is","lines are")} unpriced or unresolved` : null });
      if (p.statusInternal !== "technical_review_required")
        out.push({ id:"tech", label:"Send to technical review" });
      out.push({ id:"clarify", label:"Request clarification" });
      break;
    case "customer_clarification_required":
      out.push({ id:"resume", label:"Resume pricing", primary:true });
      break;
    case "quote_issued":
      /* Ops has no move here, and saying so is the honest state. */
      break;
  }
  out.push({ id:"note", label:"Add a note" });
  return out;
}
function confirmInline(c) {
  return `<div class="of-confirm">
    <p class="t-bd-sm">${esc(c.text)}</p>
    ${c.field ? `<textarea placeholder="${esc(c.placeholder||"")}" data-field="confirm"></textarea>` : ""}
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="of-btn t-bd-sm" data-variant="primary" data-act="confirm-yes">${esc(c.yes)}</button>
      <button class="of-btn t-bd-sm" data-act="confirm-no">Cancel</button>
    </div></div>`;
}

/* F.3 as corrected by the audit: the band is a CHECK-constrained three-value
   enum. "Medium" is the residual bucket — printing a numeric cause for it would
   invent the very derivation this screen exists to avoid. */
function firmness(l) {
  switch (l.band) {
    case "high":   return "High — one candidate clearly ahead and every hard rule passed.";
    case "medium": return "Medium — not a clear win; the reason is not recorded.";
    case "low":    return "Low — no priceable configuration was available.";
    default:       return "Not recorded — this line was created by hand.";
  }
}

function unitsBlock(l, editable) {
  const spanTotal = (l.segments||[]).reduce((a,s)=>a+s.span,0);
  return `<div class="of-block">
    <div class="of-block-h t-label">Units <span class="font-data">${l.segments.length} joined · side by side</span>
      ${editable ? `<button class="of-btn" data-variant="ghost" data-act="add-unit" style="margin-left:auto">
        ${l.segments.length >= DATA.compositePolicy.max ? `Maximum ${DATA.compositePolicy.max} units` : "+ Add unit"}</button>` : ""}
    </div>
    <table class="of-units t-bd-sm">
      <thead><tr><th>#</th><th>Product</th><th>Along</th><th>State</th><th class="right">Total</th><th></th></tr></thead>
      <tbody>${l.segments.map(s => `<tr>
        <td class="quiet font-data">${s.n}</td>
        <td>${esc(s.productName)}<span class="sub quiet t-cap">Spec: ${s.changed.length
          ? `${s.changed.length} changed — ${esc(s.changed.join(", "))}` : "as the opening"}</span></td>
        <td class="font-data">${mm(s.span)} mm</td>

    <p class="t-cap quiet" style="margin-top:6px">Units span ${mm(spanTotal)} mm of a ${mm(l.width)} mm opening
      — tolerance ${DATA.compositePolicy.tolerance} mm, joiner ${DATA.compositePolicy.joiner} mm.</p>
    <p class="t-cap quiet">Frame system: ${l.segments.every(s => s.frameSystem === l.segments[0].frameSystem)
      ? `${esc(l.segments[0].frameSystem)} throughout — read from the client catalogue by product slug, not from the workspace payload.`
      : "mixed frame systems — confirm these couple."}</p>
  </div>`;
}

/* F.4 as corrected: the workspace DTO carries no ai_proposal_line, so a line
   with no configuration snapshot gets a NAMED ABSENCE, never the current value
   repeated back as though the machine had proposed it. */
function ledgerBlock(l) {
  if (l.origin === "manual") {
    return `<div class="of-block"><div class="of-block-h t-label">Machine proposed / now / edited</div>
      <p class="t-bd-sm">No machine proposal for this line — it was created by hand.</p></div>`;
  }
  const composite = l.lineKind === "composite_parent";
  const now = {};
  /* On a composite parent the product belongs to the UNITS, so there is nothing
     to compare a single product against — the same rule the editor follows when
     it hides the product control on a parent. Comparing the machine's product to
     the first segment's would read as a change nobody made. */
  if (!composite) now.product = l.productSlug;
  now.size = `${mm(l.width)} × ${mm(l.height)}`;
  now["Colour"] = l.options["Colour"];
  now["Glass"] = l.options["Glass"];
  now["Installation"] = l.options["Installation"];
  const snap = l.snapshot;
  /* Compare on VALUE, not on presentation. "1810 × 1210" and "1,810 × 1,210" are
     the same size, and a thousands separator rendering as a human edit is a
     fabricated difference — the exact failure this ledger exists to prevent. */
  const same = (a, b) => String(a).replace(/[,\s]/g, "").toLowerCase() === String(b).replace(/[,\s]/g, "").toLowerCase();
  const rows = Object.keys(now).map(k => {
    const machine = snap ? (snap[k] != null ? snap[k] : null) : null;
    const changed = snap && machine != null && !same(machine, now[k]);
    const edited = (l.editedFields||[]).includes(String(k).toLowerCase());
    return `<tr data-changed="${changed?1:0}">
      <td>${snap ? (machine != null ? esc(machine) : absence("not retrievable"))
                 : absence("machine column not available")}</td>
      <td>${esc(now[k])}</td>
      <td>${changed || edited ? "edited" : "—"}</td></tr>`;
  }).join("");
  return `<div class="of-block">
    <div class="of-block-h t-label">Machine proposed / now / edited</div>
    ${!snap ? `<p class="t-cap" style="margin-bottom:8px">${absence(
      "The configuration snapshot is not returned by the workspace endpoint, so the machine column cannot be filled.")}</p>` : ""}
    ${composite ? `<p class="t-cap quiet" style="margin-bottom:8px">The product belongs to the units, not to the
      opening, so this ledger compares only what the parent owns.</p>` : ""}
    <table class="of-ledger t-bd-sm">
      <thead><tr><th>Machine proposed</th><th>Now</th><th>Edited</th></tr></thead>
      <tbody>${rows}</tbody></table>
    ${(l.editedFields||[]).length ? `<p class="t-cap" style="margin-top:8px">
      Locked against re-extraction: ${esc(l.editedFields.join(", "))}. A re-upload will not overwrite
      ${plural(l.editedFields.length,"it","them")}.</p>
      <p class="t-cap quiet">Which fields were edited is recorded; who edited each one, and when, is not.</p>` : ""}
  </div>`;
}

function editorBlock(l) {
  const d = S.drafts[l.id] || {};

  return `<div class="of-editor">
    <div class="of-block-h t-label">Edit ${esc(l.code)}</div>

    </div>
    ${l.lineKind === "composite_parent"
      ? `<p class="t-cap quiet">Product and options belong to the units on a composite parent, so neither is offered here.</p>`
      : `<div class="of-grid2">
          <label class="of-field"><span class="lbl t-cap">Colour</span>
            <select data-field="colour" data-id="${l.id}">
              <option${l.options.Colour==="Monument"?" selected":""}>Monument</option>
              <option${l.options.Colour==="Surfmist"?" selected":""}>Surfmist</option>

          <label class="of-field"><span class="lbl t-cap">Glass</span>

              <option${/Obscure/.test(l.options.Glass)?" selected":""}>Obscure double glazed</option>
              <option>Acoustic laminate</option></select></label>
        </div>`}
    <p class="t-cap quiet">Price preview recomputes on save. Quantity is set at submission and is not editable here.</p>
    ${err ? `<div class="of-err-inline t-bd-sm">${esc(err.msg)}
      ${err.option ? `<br><button class="of-btn" data-variant="ghost" data-act="goto"
        data-href="#/products/options?q=${encodeURIComponent(err.option)}">Price this option ▸</button>` : ""}

    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="of-btn t-bd-sm" data-variant="primary" data-act="save" data-id="${l.id}">
        ${S.busy === l.id ? "Saving…" : "Save"}</button>
      <button class="of-btn t-bd-sm" data-act="cancel-edit">Discard</button>
    </div></div>`;
}

function splitBlock(l) {
  const segs = l.segments || [{n:1,span:Math.round(l.width/2)},{n:2,span:l.width - Math.round(l.width/2)}];
  const total = segs.reduce((a,s)=>a+s.span,0);
  const delta = total - l.width;
  return `<div class="of-editor">
    <div class="of-block-h t-label">Plan ${esc(l.code)} as joined frames</div>
    <table class="of-units t-bd-sm"><tbody>
      ${segs.map(s => `<tr><td class="quiet font-data">${s.n}</td>
        <td><input value="${s.span}" data-field="span" style="width:90px;border:1px solid var(--line-strong);padding:4px 6px"></td>
        <td class="quiet t-cap">mm along the opening</td></tr>`).join("")}
    </tbody></table>
    <p class="t-cap ${Math.abs(delta) > DATA.compositePolicy.tolerance ? "warn-tx" : "quiet"}" style="margin-top:8px">
      ${delta === 0 ? `Units span ${mm(total)} mm — exactly the opening.`
        : Math.abs(delta) <= DATA.compositePolicy.tolerance
          ? `Units span ${mm(total)} mm against a ${mm(l.width)} mm opening — within the ${DATA.compositePolicy.tolerance} mm tolerance.`
          : `Units span ${mm(total)} mm against a ${mm(l.width)} mm opening — ${mm(Math.abs(delta))} mm ${delta>0?"over":"short"}. Allowed — recorded on the line.`}</p>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="of-btn t-bd-sm" data-variant="primary" data-act="noop">Create units</button>
      <button class="of-btn t-bd-sm" data-act="cancel-split">Cancel</button></div>
  </div>`;
}

/* ── Pane C — the derivation. Ten hops, expansion remembered across lines. ─── */
function paneC(p, l) {
  if (!l) return `<div class="of-pane of-pane-c"></div>`;
  const f = (DATA.files[p.id]||[]).find(x => l.evidence && x.id === l.evidence.fileId);
  const H = [];

  H.push(hop(1, "Source document", l.evidence ? `
    <dl class="t-cap">
      <dt>File</dt><dd>${f ? esc(f.filename) : absence("not linked")}</dd>
      <dt>Kind</dt><dd>${f ? esc(f.kind) : "—"}</dd>
      <dt>Size</dt><dd>${f ? bytes(f.size) : "—"}</dd>
      <dt>Scan</dt><dd>${f ? esc(f.virus_status) : "—"}</dd>
      <dt>Uploaded</dt><dd>${f ? esc(f.uploaded) : "—"}</dd>
    </dl>
    <p style="margin-top:8px">${!f ? "" : f.virus_status === "clean"
      ? `<button class="of-btn t-cap" data-act="noop">Download</button>`
      : f.virus_status === "infected" ? `<span class="quiet t-cap">Blocked</span>`
      : `<button class="of-btn t-cap" data-act="rescan" data-id="${f.id}">Scan to unlock</button>`}</p>
    <p class="t-cap" style="margin-top:8px">${absence("Page, sheet and region are not recorded for this fact.")}</p>`
    : `<p class="t-cap">${absence("No source document — this line was created by hand.")}</p>`));

  H.push(hop(2, "Extracted fact", l.evidence ? `
    <p class="t-cap ink-soft">“${esc(l.evidence.extracted)}”</p>
    <p class="t-cap quiet" style="margin-top:4px">Reconstructed by the extractor — not the verbatim source row.</p>
    <dl class="t-cap" style="margin-top:8px"><dt>Origin</dt><dd>${esc(l.evidence.origin)}</dd></dl>
    ${l.evidence.modelTag != null ? `<p class="t-cap" style="margin-top:6px">
      <span class="font-data">${l.evidence.modelTag}</span> — declared by the extraction model,
      self-reported, nothing corroborates it.</p>` : ""}`
    : `<p class="t-cap">${absence("Nothing was extracted for this line.")}</p>`));

  H.push(hop(3, "Opening in the building model", l.model ? `
    <dl class="t-cap">
      <dt>Tag</dt><dd>${esc(l.model.tag)}</dd>
      <dt>Room</dt><dd>${l.model.room ? esc(l.model.room) : absence("not recorded")}</dd>
      <dt>Orientation</dt><dd>${l.model.orientation ? esc(l.model.orientation) : absence("not recorded")}</dd>
      <dt>Shading</dt><dd>${l.model.projection ? esc(l.model.projection) : absence("not recorded")}</dd>
      <dt>Glass asked</dt><dd>${esc(l.model.glass)}</dd>
      <dt>Colour asked</dt><dd>${esc(l.model.colour)}</dd>
      <dt>Flyscreen</dt><dd>${l.model.flyscreen ? esc(l.model.flyscreen) : absence("not recorded")}</dd>
    </dl>
    ${l.model.conflict ? `<div class="of-banner t-cap" data-tone="warn" style="margin-top:8px">
      <span>Conflict · ${esc(l.model.conflict.field)} — ${esc(l.model.conflict.resolution)}<br>
      ${l.model.conflict.values.map(v => `${esc(v.v)} <span class="quiet">(${esc(v.file)})</span>`).join("<br>")}</span></div>` : ""}`
    : `<p class="t-cap">${absence("No building model for this project.")}</p>`));

  H.push(hop(4, "Requirement", l.thermal.target ? `
    <dl class="t-cap"><dt>Band</dt><dd>${esc(l.thermal.target)}</dd>
      <dt>Basis</dt><dd>${esc(humanise(l.thermal.basis))}</dd>
      ${l.thermal.inherited ? `<dt>Scope</dt><dd>inherited from the opening</dd>` : ""}</dl>
    <p class="t-cap" style="margin-top:6px">${absence(
      "The default-envelope archetype is recorded in opening_requirements, which no ops endpoint reads.")}</p>`
    : `<p class="t-cap">${absence("No target was derived for this opening.")}</p>`));

  H.push(hop(5, "Candidates", `
    <p class="t-cap">${absence("The candidate evaluation is recorded but no endpoint reads it.")}</p>
    <p class="t-cap quiet" style="margin-top:6px">candidate_result holds one row per product × variant with
      per-filter pass/fail, a human-readable reason, six score components and a rank. It is the largest
      already-paid-for, unrendered dataset in the system.</p>
    <p class="t-cap" style="margin-top:6px">${absence(
      "Rule, ranker and catalogue versions are recorded in selection_run and no endpoint reads them.")}</p>`));

  H.push(hop(6, "Chosen", l.origin === "manual" ? `
    <p class="t-cap">${absence("Chosen by hand — there is no machine selection to show.")}</p>` : `
    <dl class="t-cap">
      <dt>Product</dt><dd>${esc(l.productSlug || (l.segments ? l.segments[0].productSlug : "—"))}</dd>
      <dt>Variant</dt><dd>${l.selectedVariantId ? esc(l.selectedVariantId) : absence("none selected")}</dd>
      <dt>Basis</dt><dd>${l.basis ? esc(humanise(l.basis)) : absence("not recorded")}</dd>
    </dl>
    <p class="t-cap quiet" style="margin-top:6px">Score components live in candidate_result — see hop 5.</p>`));

  H.push(hop(7, "Thermal", `
    <dl class="t-cap">
      <dt>Target</dt><dd>${l.thermal.target ? esc(l.thermal.target) : absence("none derived")}</dd>
      <dt>Proposed</dt><dd>${l.thermal.proposed ? esc(l.thermal.proposed) : absence("nothing proposed")}</dd>
      <dt>Achieved</dt><dd>${l.thermal.achieved ? esc(l.thermal.achieved) : absence("not computed")}
        ${l.thermal.achievedSource === "estimated" ? `<span class="quiet"> (estimated)</span>` : ""}</dd>
    </dl>
    <p class="t-bd-sm" style="margin-top:6px">
      <span class="of-status-word" data-tone="${l.thermal.tone}">${esc(l.thermal.verdict)}</span></p>`));

  H.push(hop(8, "Compatibility", l.lineKind === "composite_parent" ? `
    <p class="t-cap">${l.segments.every(s => s.frameSystem === l.segments[0].frameSystem)
      ? `All ${l.segments.length} units are ${esc(l.segments[0].frameSystem)} — they couple.`
      : "Mixed frame systems — frames of different depth do not couple, so they cannot be joined in one opening."}</p>
    <p class="t-cap quiet" style="margin-top:6px">Read from the client catalogue by segment product slug.
      The frame system is not in the workspace payload.</p>
    <p class="t-cap quiet">5 filters evaluated.</p>`
    : `<p class="t-cap">${absence("The frame system of a single line is not recorded anywhere.")}</p>`));

  H.push(hop(9, "Price", `
    <p class="t-cap">${absence("The pricing snapshot for this line is stored and not returned by the workspace endpoint.")}</p>
    <p class="t-cap" style="margin-top:6px"><button class="of-btn" data-variant="ghost" data-act="goto"
      data-href="#/products/cards/${esc(l.productSlug || "amj80-awning")}">See this product's worked example ▸</button></p>`));

  H.push(hop(10, "Human edits", (l.editedFields||[]).length ? `
    <p class="t-cap">Edited: ${esc(l.editedFields.join(", "))}</p>
    <p class="t-cap" style="margin-top:6px">These fields are locked against re-extraction.
      A re-upload will not overwrite them.</p>
    <p class="t-cap quiet" style="margin-top:6px">Which fields were edited is recorded; who edited each one,
      and when, is not. Intermediate values between edits were not kept.</p>`
    : `<p class="t-cap">${absence("No field on this line has been edited by a person.")}</p>`));

  const notes = (DATA.notes[p.id]||[]).filter(n => n.lineId === l.id);
  return `<div class="of-pane of-pane-c">
    <div class="of-pane-head"><span class="t-label quiet">Derivation</span>
      <span class="n t-data-sm sage-tx">${esc(l.code)}</span></div>
    ${H.join("")}
    <div style="padding:12px 14px">
      <div class="of-block-h t-label">Notes <span class="font-data">${notes.length}</span>
        <button class="of-btn" data-variant="ghost" data-act="noop" style="margin-left:auto">+ on ${esc(l.code)}</button></div>
      ${notes.length ? notes.map(n => `<p class="t-cap ink-soft">“${esc(n.body)}”</p>
        <p class="t-cap quiet" style="margin-bottom:8px">${esc(n.actor)} · ${esc(n.when)}</p>`).join("")
        : `<p class="t-cap">${absence("No note on this line.")}</p>`}
    </div>
  </div>`;
}
function hop(n, title, body) {
  const open = !!S.hops[n];
  return `<section class="of-hop">
    <button class="of-hop-h" data-act="hop" data-n="${n}" aria-expanded="${open}">

      <span class="caret" aria-hidden="true">${open ? "▾" : "▸"}</span></button>

}

/* ═════════════════════════════════════════════════════════════════════════════
   RECORD SCOPE — the same three columns, a different mode. This is where the
   order flow, files, history, payments and learning live, without a fourth pane
   and without a second screen.
   ═════════════════════════════════════════════════════════════════════════════ */
const RTABS = [
  { id:"flow", label:"Flow" }, { id:"revisions", label:"Revisions" }, { id:"thermal", label:"Thermal" },
  { id:"teach", label:"Teach" }, { id:"history", label:"History" }, { id:"files", label:"Files" },
];

function paneRecordB(p, lines) {
  const tab = S.route.tab || "flow";

  const learn = DATA.learning[p.id] || [];

  if (tab === "flow") body = flowList(p);
  else if (tab === "revisions") body = revs.length ? `
      <table class="of-row-list"><tbody>${revs.map(r => `<tr>

    : `<div class="of-state"><p class="t-bd-sm">No revision has been issued.</p>

  else if (tab === "thermal") body = `<table class="of-row-list"><thead><tr>
      <th>Line</th><th>Target</th><th>Achieved</th><th>Result</th></tr></thead><tbody>
      ${lines.map(l => `<tr><td class="font-data sage-tx">${esc(l.code)}</td>
        <td class="t-cap">${l.thermal.target ? esc(l.thermal.target) : absence("none derived")}</td>
        <td class="t-cap">${l.thermal.achieved ? esc(l.thermal.achieved) : absence("not computed")}</td>
        <td><span class="of-status-word" data-tone="${l.thermal.tone}">${esc(l.thermal.verdict)}</span></td>
      </tr>`).join("")}</tbody></table>
      <p class="t-cap quiet" style="margin-top:8px"><button class="of-btn" data-variant="ghost" data-act="thermal">

  else if (tab === "teach") body = learn.length ? learn.map(o => `
      <div class="card" style="padding:12px;margin-bottom:10px">
        <p class="t-bd-sm">Line ${esc(o.line)} — the machine proposed <b>${esc(o.proposed)}</b>,
          a person issued <b>${esc(o.final)}</b>.</p>
        <p class="t-cap quiet">AI ${money0(o.proposedTotal)} · issued ${money0(o.finalTotal)}</p>
        <table class="of-ledger t-bd-sm" style="margin-top:8px">
          <thead><tr><th>Field</th><th>Proposed</th><th>Issued</th></tr></thead>
          <tbody>${o.diff.map(d => `<tr data-changed="1"><td class="quiet">${esc(d[0])}</td>
            <td>${esc(d[1])}</td><td>${esc(d[2])}</td></tr>`).join("")}</tbody></table>
        <div style="display:flex;gap:8px;margin-top:10px;align-items:center">
          <select style="border:1px solid var(--line-strong);padding:5px 7px">
            <option value="">— why did it change? —</option>
            <option>Customer changed their mind</option><option>Schedule was ambiguous</option>
            <option>Thermal target could not be met</option><option>Pricing was unavailable</option></select>
          <button class="of-btn t-bd-sm" data-variant="primary" data-act="noop">Approve</button>
          <button class="of-btn t-bd-sm" data-act="noop">Reject</button>
        </div>
        <p class="t-cap quiet" style="margin-top:6px">A reason is required before this can be approved.</p>
      </div>`).join("")
    : `<div class="of-state"><p class="t-bd-sm">Nothing to teach from this job.</p>
        <p class="hint t-cap">Outcomes appear once a quote is issued and a line differs from the machine's proposal.</p></div>`;
  else if (tab === "history") body = acts.length ? `
      <ol class="card">${acts.map(e => `<li style="padding:9px 12px;border-bottom:1px solid var(--rule-05);display:flex;gap:12px">
        <span class="t-label quiet" style="width:56px;flex:0 0 56px">${esc(e.entity)}</span>
        <span class="t-bd-sm ink-soft" style="flex:1">${esc(e.action)}</span>
        <span class="t-cap quiet nowrap">${esc(e.actor)} · ${esc(e.when)}</span></li>`).join("")}</ol>
      <p class="t-cap quiet" style="margin-top:8px">Server sentences and dotted keys are printed as written.
        The payload stored with each event is not returned by the audit endpoint.</p>`
    : `<div class="of-state"><p class="t-bd-sm">Nothing has happened yet.</p></div>`;
  else if (tab === "files") body = files.length ? `
      <table class="of-row-list"><thead><tr>

          <td>${scanChip(f.virus_status)}</td>
          <td class="quiet t-cap">${esc(f.uploaded)}${f.scanned_at ? `<span class="sub">scanned ${esc(f.scanned_at)} · ${esc(f.scan_engine)}</span>` : ""}</td>
          <td class="right">${f.virus_status === "clean" ? `<button class="of-btn" data-variant="ghost" data-act="noop">Download</button>`

  return `<div class="of-pane of-pane-b">
    <div class="of-tabs">${RTABS.map(t => `<button class="of-tab t-bd-sm" data-act="rtab" data-tab="${t.id}"

    <div class="of-b-inner">${body}</div></div>`;
}
function scanChip(s) {
  const st = s === "clean" ? `style="border-color:var(--rule-12);color:var(--body)"`
    : s === "infected" ? `style="background:var(--chip-inf-bg);border-color:var(--chip-inf-bd);color:var(--chip-inf-tx)"`
    : `style="background:var(--chip-pen-bg);border-color:var(--chip-pen-bd);color:var(--chip-pen-tx)"`;
  return `<span class="of-chip" ${st}>${esc(s)}</span>`;
}

/* The lifecycle, with the gates named. There is no internal approval step, so
   the screen says which gates are real and who has to move at each one.
   Timestamps appear ONLY where the schema stamps one — everything else reads
   "not recorded" rather than inferring a time from the audit log. */
function flowList(p) {
  const hasOrder = !!p.orderNo;
  const acts = DATA.activity[p.id] || [];
  const stamp = (needle) => { const e = acts.find(a => a.action.includes(needle)); return e ? `${e.when} · ${e.actor}` : null; };
  const steps = [
    { k:"submitted", label:"submitted", done:true, when:null, note:"the customer uploads documents and asks for a quote" },
    { k:"parsed", label:"parsed", done:true, when:stamp("schedule parsed"),
      note:"the schedule became openings", link:true },
    { k:"pricing", label:"pricing started", done:p.phase !== "Intake", when:stamp("started pricing") },
    { gate:true, label:"GATE · every line settled", done:unresolvedOf(p) === 0,
      note:unresolvedOf(p) ? `${unresolvedOf(p)} ${plural(unresolvedOf(p),"line is","lines are")} unpriced or unresolved. This is what disables Issue reviewed quote.`
        : "Every line is priced and resolved." },
    { k:"issued", label:"issue revision", done:["Issued","Accepted","Production","Delivered"].includes(p.phase),
      when:stamp("issued revision"), note:"freezes the draft and emails the customer" },
    { gate:true, label:"GATE · the customer accepts, or asks for changes", done:hasOrder,
      note:"accept → an order is raised with a deposit and a balance · changes → back to pricing, the revision is superseded" },
    { k:"deposit", label:"deposit invoiced → we record the payment", done:hasOrder && p.statusInternal !== "deposit_invoiced" },
    { k:"drawings", label:"shop drawings shared", done:p.statusInternal === "manufacturing" || p.phase === "Delivered" },
    { gate:true, label:"GATE · the customer approves the drawings",
      done:p.statusInternal === "manufacturing" || p.phase === "Delivered",
      note:"we may record their approval by phone" },
    { k:"mfg", label:"manufacturing → QA photos → balance invoiced", done:p.phase === "Delivered" },
    { gate:true, label:"GATE · the customer confirms for dispatch", done:p.phase === "Delivered" },
    { k:"out", label:"dispatched → delivered → after sales", done:p.phase === "Delivered" },
  ];
  return `<div class="of-block-h t-label">The journey of this job</div>
    ${steps.map(s => `<div class="of-flow-step" data-done="${s.done?1:0}" data-gate="${s.gate?1:0}">
      <span class="of-flow-mark" aria-hidden="true">${s.gate ? "▢" : s.done ? "✓" : "▢"}</span>
      <span style="flex:1;min-width:0">
        <span class="t-bd-sm ${s.gate?"warn-tx":""}">${esc(s.label)}</span>
        ${s.note ? `<span class="t-cap quiet" style="display:block">${esc(s.note)}</span>` : ""}
        ${s.link ? `<button class="of-btn" data-variant="ghost" data-act="scope" data-scope="opening">open the derivation →</button>` : ""}
      </span>
      ${!s.gate ? `<span class="of-flow-when t-cap">${s.when ? esc(s.when) : absence("not recorded")}</span>` : ""}
    </div>`).join("")}
    <p class="t-cap quiet" style="margin-top:12px">Every step above is a real transition in this system.
      GATE rows are the only things that can stop it, and each names who has to move.
      There is no internal approval step — the approval engine was retired, and what replaced it is
      this gate list plus the per-line review flags.</p>
    <p class="t-cap quiet" style="margin-top:6px">A time appears only where the schema stamps one.
      “not recorded” means the event is real and its moment was never written down.</p>`;
}

function queueShell(title, viewsHtml, body, foot) {
  return `<div class="of-queue-page"><div class="of-queue-inner">
    <div class="of-page-head">
      <button class="of-menu-btn" data-act="drawer" aria-label="Open menu">☰</button>
      <h1>${esc(title)}</h1>
      <button class="of-search-stub t-bd-sm" data-act="omni"><span aria-hidden="true">⌕</span>

    ${viewsHtml ? `<div class="of-views">${viewsHtml}</div>` : ""}
    ${body}
    ${foot ? `<div class="of-foot-strip t-cap">${foot}</div>` : ""}
  </div></div>`;
}
