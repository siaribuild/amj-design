/* ═════════════════════════════════════════════════════════════════════════════
   OVERLAYS — the omnibox, the shortcut sheet, the phone drawer.
   The drawer is an overlay and never a route: the surface beneath is not
   unmounted, so an open record, its scroll position and any half-typed field
   survive it.
   ═════════════════════════════════════════════════════════════════════════════ */
function searchAll(q) {
  q = q.trim().toLowerCase();
  if (q.length < 2) return null;
  const out = { Projects:[], Customers:[], Leads:[], Products:[] };
  DATA.projects.forEach(p => {
    if ([p.ref,p.orderNo,p.title,p.org,p.customerName].filter(Boolean).join(" ").toLowerCase().includes(q))
      out.Projects.push({ label:`${p.ref || p.orderNo}  ${p.title}`, hint:humanise(p.statusCustomer), href:`#/r/${p.id}` });
  });
  DATA.customers.forEach(c => {
    if ([c.name,c.email,c.company].filter(Boolean).join(" ").toLowerCase().includes(q))
      out.Customers.push({ label:c.company || c.name, hint:c.email, href:`#/customers/${c.id}` });
  });
  DATA.enquiries.forEach(e => {
    if ([e.ref,e.name,e.email].join(" ").toLowerCase().includes(q))
      out.Leads.push({ label:`${e.ref}  ${e.name}`, hint:humanise(e.kind), href:`#/leads/all/${e.id}` });
  });
  DATA.products.forEach(p => {
    if ([p.name,p.slug].join(" ").toLowerCase().includes(q))
      out.Products.push({ label:p.name, hint:p.slug, href:`#/products/cards/${p.slug}` });
  });
  Object.keys(out).forEach(k => { out[k] = out[k].slice(0,8); if (!out[k].length) delete out[k]; });
  return out;
}
function flatResults(groups) {
  const flat = []; Object.keys(groups||{}).forEach(g => groups[g].forEach(r => flat.push(r))); return flat;
}
function renderOverlay() {
  let html = "";
  if (S.omni.open) {
    const groups = searchAll(S.omni.q);
    const flat = flatResults(groups);
    let inner;
    if (groups === null) inner = `<div class="of-omni-group"><p class="of-omni-row quiet">Keep typing…</p></div>`;
    else if (!flat.length) inner = `<div class="of-omni-group"><p class="of-omni-row quiet">No matches for “${esc(S.omni.q)}”.</p></div>`;
    else inner = Object.keys(groups).map(g => `<div class="of-omni-group">
        <div class="gh">${g}</div>
        ${groups[g].map(r => { const i = flat.indexOf(r); return `<button class="of-omni-row t-bd-sm"
          data-act="omni-open" data-href="${r.href}" data-active="${i === S.omni.ix ? 1 : 0}">
          <span>${esc(r.label)}</span><span class="hint t-cap">${esc(r.hint)}</span></button>`; }).join("")}
      </div>`).join("");
    html += `<div class="of-scrim" data-act="close-overlay"></div>
      <div class="of-omni" role="dialog" aria-label="Search">
        <input id="omni-input" placeholder="Search projects, orders, customers…" value="${esc(S.omni.q)}"
          autocomplete="off" data-field="omni">
        ${inner}
        <div class="of-omni-foot t-cap">↑↓ move · ⏎ open · esc close</div></div>`;
  }
  if (S.sheet) {
    html += `<div class="of-scrim" data-act="close-overlay"></div>
      <div class="of-sheet" role="dialog" aria-label="Keyboard shortcuts">
        <h2 class="t-hd3">Keyboard</h2>
        <div class="of-banner t-bd-sm" data-tone="info" style="margin-top:12px">
          <span aria-hidden="true">▤</span>
          <span>Navigation is on the <b>${S.nav === "top" ? "top bar" : "left rail"}</b>.
            Pane A is itself a rail, so a nav rail beside it stacks two; a top bar does not compete,
            but costs 48px of height off all three panes.
            <button class="of-btn t-bd-sm" data-variant="ghost" data-act="nav">
              Switch to the ${S.nav === "top" ? "left rail" : "top bar"} →</button></span></div>
        <table class="of-spec t-bd-sm" style="margin-top:12px">
          ${[["L","switch navigation between the rail and the top bar"],
             ["⌘K or /","open the omnibox"],["g then w / l / c / p / a / s","go to a destination"],
             ["j / k","next / previous opening"],["1–9","select that opening"],
             ["e","edit the selected line"],["u","units / split"],["n","note on this line"],
             ["T","the whole line table"],["r","the record scope"],["i","back to the opening scope"],
             ["[ / ] / \\","collapse the openings / derivation / both"],["?","this sheet"],["Esc","unwind one level"]]
            .map(([k,v]) => `<tr><td class="t-cap"><span class="of-kbd">${esc(k)}</span></td><td>${esc(v)}</td></tr>`).join("")}
        </table>
        <p style="margin-top:14px"><button class="of-btn t-bd-sm" data-act="close-overlay">Close</button></p></div>`;
  }
  if (S.modal) {
    html += `<div class="of-scrim" data-act="close-overlay"></div>
      <div class="of-modal" role="dialog" aria-label="${esc(S.modal.title)}">
        <h2 class="t-hd3">${esc(S.modal.title)}</h2>
        <p class="t-bd-sm" style="margin-top:8px">${esc(S.modal.body)}</p>
        <div style="display:flex;gap:8px;margin-top:14px">
          <button class="of-btn t-bd-sm" data-variant="primary" data-act="close-overlay">${esc(S.modal.yes)}</button>
          <button class="of-btn t-bd-sm" data-act="close-overlay">Cancel</button></div></div>`;
  }
  if (S.drawer) {
    html += `<div class="of-scrim" data-act="close-overlay"></div>
      <aside class="of-drawer" id="ops-nav-drawer" data-open="1">
        <div class="of-rail-head" style="justify-content:space-between">
          <span class="of-rail-word t-bd-sm">OpenFrame Ops</span>
          <button data-act="close-overlay" style="color:rgba(255,255,255,.6);width:44px;height:44px" aria-label="Close menu">✕</button>
        </div>
        <nav class="of-rail-nav">${railFor().map(it => `<a class="of-rail-item t-bd-sm" href="${it.href}"
          data-act="close-overlay"><span class="of-rail-ico" aria-hidden="true">${it.ico}</span>${it.label}</a>`).join("")}</nav>
        <div class="of-rail-foot t-cap"><div class="nm t-bd-sm">${esc(DATA.me.name)}</div>
          <div class="em">${esc(DATA.me.email)}</div>
          <button data-act="signout">Sign out</button></div></aside>`;
  }
  document.getElementById("overlay").innerHTML = html;
  document.body.style.overflow = (S.omni.open || S.sheet || S.drawer || S.modal) ? "hidden" : "";
  const inp = document.getElementById("omni-input");
  if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
}

/* ═════════════════════════════════════════════════════════════════════════════
   The dev menu — every state the prototype must reach without editing code.
   ═════════════════════════════════════════════════════════════════════════════ */
const DEV = [
  ["loading","Loading"],["empty","Empty view"],["error","Failed load"],["degraded","Degraded counts"],
  ["conflict","409 + kept draft"],["readonly","Read-only record"],["manufacturer","Manufacturer role"],
  ["missingOption","Missing option price"],
];
function renderDev() {
  /* Accepts ?dev=1 before OR after the hash — opening this file from disk through
     a preview shell can drop the query string, and the states menu is the only
     way to reach half the screens this prototype exists to show. */
  if (!/[?&]dev=1/.test(location.search + location.hash)) { document.getElementById("devbar").innerHTML = ""; return; }
  document.getElementById("devbar").innerHTML = `<details class="of-devbar" open>
    <summary>Prototype states</summary>
    <div class="of-dev-body">
      ${DEV.map(([k,l]) => `<button data-act="flag" data-flag="${k}" data-on="${S.flags[k]?1:0}">${l}</button>`).join("")}
      <button data-act="goto" data-href="#/r/p-10482">Bench · Brighton</button>
      <button data-act="goto" data-href="#/r/p-10482?scope=record">Record scope</button>
      <button data-act="goto" data-href="#/r/p-1177?scope=record">An order · payments</button>
      <button data-act="goto" data-href="#/r/p-1094?scope=record&tab=teach">Teach</button>
      <button data-act="goto" data-href="#/r/p-10388">Ops has no move</button>
      <button data-act="nav" data-on="${S.nav === "top" ? 1 : 0}">Nav: ${S.nav === "top" ? "top bar" : "left rail"}</button>
      <button data-act="sheet">Shortcuts</button>
      <button data-act="clear-flags">Reset</button>
    </div></details>`;
}

/* ═════════════════════════════════════════════════════════════════════════════
   RENDER dispatcher
   ═════════════════════════════════════════════════════════════════════════════ */
function render() {
  const r = S.route;
  let page;
  if (S.flags.manufacturer && r.name !== "leads") { location.hash = "#/leads/all"; return; }
  switch (r.name) {
    case "r":         page = renderRecord(); break;
    case "leads":     page = renderLeads(); break;
    case "customers": page = renderCustomers(); break;
    case "products":  page = renderProducts(); break;
    case "archive":   page = renderArchive(); break;
    case "settings":  page = renderSettings(); break;
    default:          page = renderWork();
  }
  const app = document.getElementById("app");
  app.dataset.nav = S.nav;
  app.innerHTML = (S.nav === "top" ? renderTopbar() : renderRail()) + `<div class="of-content">${page}</div>`;
  renderOverlay(); renderDev();
}

/* ═════════════════════════════════════════════════════════════════════════════
   E. ACTIONS — mutate in memory, then re-render. This mirrors the real client,
   which awaits the server and refetches the whole workspace; there is no
   optimistic write anywhere in the product and there is none here.
   ═════════════════════════════════════════════════════════════════════════════ */
document.addEventListener("click", (ev) => {
  const t = ev.target.closest("[data-act]");
  if (!t) return;
  const act = t.dataset.act;
  const id = t.dataset.id;
  if (act !== "goto" && t.tagName !== "A") ev.preventDefault();

  switch (act) {
    case "goto": go(t.dataset.href); break;
    case "open-record": S.route.line = null; go(`#/r/${id}`); break;
    case "view": go(`#/work/${t.dataset.view}`); break;
    case "line": S.editing = null; S.splitting = false;
      go(`#/r/${S.route.id}/${id}`); break;
    case "scope": {
      const sc = t.dataset.scope;
      go(`#/r/${S.route.id}${sc === "record" ? "?scope=record&tab=flow" : ""}`); break;
    }
    case "rtab": go(`#/r/${S.route.id}?scope=record&tab=${t.dataset.tab}`); break;
    case "hop": S.hops[t.dataset.n] = !S.hops[t.dataset.n]; render(); break;
    case "edit": S.editing = id; S.splitting = false; S.errors = {}; render(); break;
    case "cancel-edit": S.editing = null; S.errors = {}; render(); break;
    case "split": S.splitting = true; S.editing = null; render(); break;
    case "cancel-split": S.splitting = false; render(); break;
    case "save": doSave(id); break;
    case "resolve": {
      S.resolved[id] = !S.resolved[id];
      const p = proj(S.route.id), l = linesOf(S.route.id).find(x => x.id === id);
      if (S.resolved[id] && l && l.status === "needs_review") l.status = "ready";
      else if (!S.resolved[id] && l && l.status === "ready" && reasonsOf(l).length) l.status = "needs_review";
      render(); break;
    }
    case "add-unit": {
      const l = linesOf(S.route.id).find(x => x.id === S.route.line);
      if (l && l.segments && l.segments.length < DATA.compositePolicy.max) {
        const n = l.segments.length + 1;
        l.segments.push({ id:"s"+n, n, productSlug:"amj80-fixed-light", productName:"Fixed light",
          span:300, total:420, status:"ready", changed:[], frameSystem:"AMJ80" });
        l.units.push({ n, type:"fixed", span:300 });
      }
      render(); break;
    }
    case "remove-unit": {
      S.confirm = { text:"Remove this unit? The opening will no longer be covered by its units, and that gap is recorded on the line.",
        yes:"Remove unit", act:() => {
          const l = linesOf(S.route.id).find(x => x.id === S.route.line);
          if (l) { l.segments = l.segments.filter(s => s.id !== id).map((s,i) => ({...s, n:i+1}));
                   l.units = l.segments.map(s => ({ n:s.n, type:s.productName === "Awning" ? "awning" : "fixed", span:s.span })); }
        } };
      render(); break;
    }
    case "merge": S.confirm = { text:"Merge these three units back into one opening? The per-unit specifications are discarded and cannot be recovered.",
      yes:"Merge into one", act:() => { const l = linesOf(S.route.id).find(x => x.id === S.route.line);
        if (l) { l.lineKind = "single"; l.segments = null; l.units = [{n:1,type:"awning",span:l.width}];
                 l.productName = "AMJ80 Series Awning"; l.productSlug = "amj80-awning"; } } };
      render(); break;
    case "action": doAction(id); break;
    case "confirm-yes": {
      const c = S.confirm; S.confirm = null; if (c && c.act) c.act(); render(); break;
    }
    case "confirm-no": S.confirm = null; render(); break;
    case "rescan": {
      const f = (DATA.allFiles.find(x => x.id === id)); if (f) { f.virus_status = "clean"; f.engine = "cf-av"; }
      Object.keys(DATA.files).forEach(k => DATA.files[k].forEach(x => {
        if (x.id === id) { x.virus_status = "clean"; x.scan_engine = "cf-av"; x.scanned_at = "14 Aug 2026, 14:33"; } }));
      render(); break;
    }
    case "omni": S.omni = { open:true, q:"", ix:0 }; renderOverlay(); break;
    case "omni-open": S.omni.open = false; go(t.dataset.href); break;
    case "sheet": if (S.route.name === "r" && !t.closest(".of-devbar")) { S.sheetView = !S.sheetView; render(); }
      else { S.sheet = !S.sheet; renderOverlay(); } break;
    case "thermal": go(`#/r/${S.route.id}${S.route.sub === "thermal" ? "" : "?view=thermal"}`); break;
    case "drawer": S.drawer = true; renderOverlay(); break;
    case "close-overlay": S.omni.open = false; S.sheet = false; S.drawer = false; S.modal = null; renderOverlay(); break;
    case "clear-conflict": S.flags.conflict = false; S.errors = {}; render(); break;
    case "clear-flags": Object.keys(S.flags).forEach(k => S.flags[k] = false); S.flags.reconcile = "ok"; render(); break;
    case "nav": S.nav = S.nav === "top" ? "rail" : "top"; lsSet("of.nav", S.nav); render(); break;
    case "flag": {
      const f = t.dataset.flag; S.flags[f] = !S.flags[f];
      if (f === "conflict" && S.flags.conflict) { const l = linesOf(S.route.id)[1];
        if (l) { S.editing = l.id; S.drafts[l.id] = { width:2760, height:1500 };
                 S.errors[l.id] = { msg:"Someone else changed this line while you were editing. Your values are kept.", reload:true }; } }
      if (f === "missingOption" && S.flags.missingOption) { const l = linesOf(S.route.id)[0];
        if (l) { S.editing = l.id; S.errors[l.id] = { msg:"Saved, but this configuration cannot be priced exactly: colour:custom-powdercoat has no price.",
                 option:"colour:custom-powdercoat" }; } }
      render(); break;
    }
    case "signout": S.modal = { title:"Sign out", body:"This would navigate to Cloudflare Access's logout endpoint — clearing the CF_Authorization cookie is the only thing that actually signs you out.", yes:"Understood" };
      renderOverlay(); break;
    case "copy": navigator.clipboard && navigator.clipboard.writeText(location.href); break;
    case "lane-prev": case "lane-next": {
      const list = laneRows(); const ix = list.findIndex(p => p.id === S.route.id);
      const nx = act === "lane-next" ? ix+1 : ix-1;
      if (list[nx]) { S.route.line = null; go(`#/r/${list[nx].id}`); }
      break;
    }
    case "noop": default: break;
  }
});

document.addEventListener("input", (ev) => {
  const f = ev.target.dataset.field;
  if (!f) return;
  if (f === "omni") { S.omni.q = ev.target.value; S.omni.ix = 0; renderOverlay(); return; }
  if (f === "width" || f === "height") {
    const id = ev.target.dataset.id;
    S.drafts[id] = S.drafts[id] || {};
    S.drafts[id][f] = ev.target.value;
  }
});

function doSave(id) {
  const l = linesOf(S.route.id).find(x => x.id === id);
  const d = S.drafts[id] || {};
  const w = parseInt(d.width != null ? d.width : l.width, 10);
  const h = parseInt(d.height != null ? d.height : l.height, 10);
  if (!(w > 0) || !(h > 0)) { S.errors[id] = { msg:"Width and height must be whole millimetres." }; render(); return; }
  if (w < 300 || h < 300) { S.errors[id] = { msg:"Undersize — this product cannot be made below 300 mm in either direction." }; render(); return; }
  S.busy = id; render();
  setTimeout(() => {
    S.busy = null;
    if (S.flags.missingOption) {
      S.errors[id] = { msg:"Saved, but this configuration cannot be priced exactly: colour:custom-powdercoat has no price.",
                       option:"colour:custom-powdercoat" };
    } else {
      l.width = w; l.height = h;
      l.units = (l.units||[]).map(u => ({...u, span: Math.round(w / (l.units.length||1)) }));
      if (l.segments) l.segments = l.segments.map(s => ({...s, span: Math.round(w / l.segments.length)}));
      if (!(l.editedFields||[]).includes("width")) l.editedFields = (l.editedFields||[]).concat(["width"]);
      S.editing = null; S.errors = {}; delete S.drafts[id];
    }
    render();
  }, 320);
}

function doAction(id) {
  const p = proj(S.route.id);
  const C = {
    start:   { text:`Start pricing on ${p.title}? The customer's view changes to "under review".`, yes:"Start pricing",
               act:() => { p.statusInternal = "estimator_assigned"; p.stateLabel = "Being priced"; p.phase = "Pricing"; } },
    issue:   { text:`Issue this quote to ${p.customerEmail || "the customer"}? The draft is frozen as a revision and an email is sent.`,
               yes:"Issue the quote", act:() => { p.statusInternal = "quote_issued"; p.stateLabel = "Quote issued";
                 p.phase = "Issued"; p.waitingOn = "Customer"; p.valueBasis = "issued"; p.statusCustomer = "quote_ready"; } },
    tech:    { text:"Send this job to technical review?", yes:"Send to technical review",
               act:() => { p.statusInternal = "technical_review_required"; p.stateLabel = "Technical review"; } },
    clarify: { text:`Ask ${p.customerEmail || "the customer"} for more information? They will be emailed and the job waits on them.`,
               yes:"Send the request", field:true, placeholder:"What do we need from them?",
               act:() => { p.statusInternal = "customer_clarification_required";
                 p.stateLabel = "Waiting on the customer"; p.waitingOn = "Customer"; p.statusCustomer = "needs_information"; } },
    resume:  { text:"Resume pricing on this job?", yes:"Resume pricing",
               act:() => { p.statusInternal = "estimator_assigned"; p.stateLabel = "Being priced"; p.waitingOn = "Us"; } },
    "pay-deposit": { text:`Record the deposit payment for ${p.orderNo}? Enter the bank reference so the payment can be traced.`,
               yes:"Record payment", field:true, placeholder:"EFT reference",
               act:() => { const x = (DATA.payments[p.id]||[])[0]; if (x) { x.status = "paid"; x.ref = "EFT-5109"; x.paid = "14 Aug 2026"; }
                 p.statusInternal = "manufacturing"; p.stateLabel = "Manufacturing"; p.phase = "Production"; p.waitingOn = "Nobody"; } },
    qa:      { text:"Confirm QA and invoice the balance?", yes:"Confirm and invoice", act:() => {} },
    close:   { text:"Close this job?", yes:"Close the job", act:() => {} },
    note:    { text:"Add a note to this record. Notes are internal and are never shown to the customer.",
               yes:"Save note", field:true, placeholder:"Note…", act:() => {} },
  };
  S.confirm = C[id] || null; render();
}

/* ═════════════════════════════════════════════════════════════════════════════
   F. KEYBOARD — guarded against text fields. Keyboard-first is a commitment.
   ═════════════════════════════════════════════════════════════════════════════ */
let chord = null;
document.addEventListener("keydown", (e) => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if ((e.key === "k" && (e.metaKey || e.ctrlKey))) { e.preventDefault(); S.omni = {open:true,q:"",ix:0}; renderOverlay(); return; }
  if (S.omni.open) {
    const flat = flatResults(searchAll(S.omni.q));
    if (e.key === "Escape") { S.omni.open = false; renderOverlay(); }
    else if (e.key === "ArrowDown") { e.preventDefault(); S.omni.ix = Math.min(S.omni.ix+1, flat.length-1); renderOverlay(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); S.omni.ix = Math.max(S.omni.ix-1, 0); renderOverlay(); }
    else if (e.key === "Enter" && flat[S.omni.ix]) { S.omni.open = false; go(flat[S.omni.ix].href); }
    return;
  }
  if (typing) { if (e.key === "Escape") { S.editing = null; render(); } return; }
  if (e.key === "Escape") {
    if (S.sheet || S.drawer || S.modal) { S.sheet = S.drawer = false; S.modal = null; renderOverlay(); }
    else if (S.confirm) { S.confirm = null; render(); }
    else if (S.editing || S.splitting) { S.editing = null; S.splitting = false; render(); }
    else if (S.sheetView) { S.sheetView = false; render(); }
    else if (S.route.name === "r") go(`#/work/${S.lane||"needs-us"}`);
    return;
  }
  if (chord === "g") {
    chord = null;
    const map = { w:"#/work/needs-us", l:"#/leads/all", c:"#/customers", p:"#/products/cards",
                  a:"#/archive/files", s:"#/settings/staff" };
    if (map[e.key]) { e.preventDefault(); go(map[e.key]); }
    return;
  }
  if (e.key === "g") { chord = "g"; setTimeout(() => chord = null, 900); return; }
  if (e.key === "l" || e.key === "L") { S.nav = S.nav === "top" ? "rail" : "top"; lsSet("of.nav", S.nav); render(); return; }
  if (e.key === "/") { e.preventDefault(); S.omni = {open:true,q:"",ix:0}; renderOverlay(); return; }
  if (e.key === "?") { S.sheet = true; renderOverlay(); return; }

  if (S.route.name !== "r") return;
  const lines = linesOf(S.route.id);
  const ix = lines.findIndex(l => l.id === S.route.line);
  if (e.key === "j" && lines[ix+1]) go(`#/r/${S.route.id}/${lines[ix+1].id}`);
  else if (e.key === "k" && lines[ix-1]) go(`#/r/${S.route.id}/${lines[ix-1].id}`);
  else if (/^[1-9]$/.test(e.key) && lines[+e.key-1]) go(`#/r/${S.route.id}/${lines[+e.key-1].id}`);
  else if (e.key === "e" && lines[ix]) { S.editing = lines[ix].id; S.splitting = false; render(); }
  else if (e.key === "u") { S.splitting = !S.splitting; S.editing = null; render(); }
  else if (e.key === "T") { S.sheetView = !S.sheetView; render(); }
  else if (e.key === "r") go(`#/r/${S.route.id}?scope=record&tab=flow`);
  else if (e.key === "i") go(`#/r/${S.route.id}`);
  else if (e.key === "[") { S.collapseA = !S.collapseA; render(); }
  else if (e.key === "]") { S.collapseC = !S.collapseC; render(); }
  else if (e.key === "\\") { S.collapseA = S.collapseC = !(S.collapseA && S.collapseC); render(); }
});

/* ═════════════════════════════════════════════════════════════════════════════
   G. BOOT
   ═════════════════════════════════════════════════════════════════════════════ */
window.addEventListener("hashchange", syncRoute);
if (!location.hash) location.hash = "#/work/needs-us";
syncRoute();
</script>
